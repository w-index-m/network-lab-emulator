name: pytest

# tests/ 配下の単体テスト(SNMP/TACACS+/経路削除バグ回帰テスト等)を実行する。
# regression.yml がE2Eシナリオ(実サーバー起動+HTTP経由の動作確認)を
# 担当するのに対し、こちらはFastAPI TestClientベースの単体テストを担当する。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        env:
          NETLAB_AUTH_DISABLE: '1'
        run: |
          pytest tests/ -v \
            --cov=engine --cov=app \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14
