name: pytest

# tests/ 配下の単体テスト(SNMP/TACACS+/経路削除バグ回帰テスト等)を実行する。
# regression.yml がE2Eシナリオ(実サーバー起動+HTTP経由の動作確認)を
# 担当するのに対し、こちらはFastAPI TestClientベースの単体テストを担当する。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # coverage計測付きの`pytest tests/`はローカルで~16分だが、CI上では
    # カバレッジ計装のオーバーヘッドで20分の旧設定を超えて
    # cancelledになることが実際にあった(run #53参照)。余裕を持たせる。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # tests/test_openssh_interop.py は本物のOpenSSHクライアントで
      # SSH CLIサーバ(engine/ssh_cli_agent.py)を叩く。ssh/sshpassが
      # 無い環境では自動的にスキップされるが、ubuntu-latestランナーは
      # sshpassだけ未導入なのでここで入れておく（実機ssh相互接続の
      # 回帰、特にヒアドキュメント一括投入時のパスワード空振り不具合を
      # CIでも検出できるようにする）。
      - name: Install sshpass for OpenSSH interop tests
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Lint (ruff)
        run: ruff check .

      # SSH/Telnet/NETCONF等のテストは装置IP（例: 10.227.0.1）で待ち受けるため、
      # engine/loopback_alias.py が `ip addr add <IP>/32 dev lo` でループバックに
      # IPを足す。これにはroot権限（CAP_NET_ADMIN）が必要で、一般ユーザーで動く
      # ランナーでは失敗し、bindできずに大量のタイムアウトになっていた（run #54:
      # 93 failed）。ローカルの実行環境と同じくrootで実行する。
      - name: Run pytest with coverage
        env:
          NETLAB_AUTH_DISABLE: '1'
        run: |
          sudo -E env "PATH=$PATH" pytest tests/ -v \
            --cov=engine --cov=app \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14
