# protoc/grpc_tools で自動生成されたgNMIスタブ。手書きコードではなく
# 再生成のたびに書き変わるため、ここでの未使用import指摘は対象外にする。
exclude = ["engine/gnmi_proto"]

# 実際のバグにつながりやすい指摘のみをCIでブロック対象にする。
# F841(未使用変数)はこのリポジトリの既存コードに数十件残っているが、
# 一通り目視確認した結果いずれも実害のない冗長コードだったため、
# 既存分の一括修正は別タスクとし、ここでは対象に含めない
# (docs/routing-regression-checklist.md 参照)。
[lint]
select = ["F401", "F811", "F821", "E9"]
