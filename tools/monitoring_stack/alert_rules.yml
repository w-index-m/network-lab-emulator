groups:
  - name: snmp-traps
    rules:
      - alert: SnmpLinkDownTrapReceived
        expr: increase(snmptrap_linkdown_total[1m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "linkDown trapを受信しました"

  # Strix(strix-pentest.yml)ペンテストの実行状況。
  # ユーザー提案「GrafanaアラートやGrafana Lokiと連携してほしい」への対応。
  # tools/prometheus_exporter.py が /api/pentest/runs をポーリングして
  # 公開する netlab_strix_* メトリクスを評価する。
  - name: strix-pentest
    rules:
      - alert: StrixPentestRunFailed
        # has_runs==0(一度もDispatchされていない)の時にlast_run_success==0
        # だけで誤発火しないよう、実際にrunがあることをゲートする。
        expr: netlab_strix_has_runs == 1 and netlab_strix_last_run_success == 0 and netlab_strix_last_run_in_progress == 0
        labels:
          severity: critical
        annotations:
          summary: "直近のStrixペンテスト実行が失敗しました"
      - alert: StrixPentestStale
        expr: netlab_strix_last_success_age_seconds > 604800 or netlab_strix_last_success_age_seconds < 0
        labels:
          severity: warning
        annotations:
          summary: "Strixペンテストが7日間(または一度も)成功していません"

  # k6(tools/k6_slb_load.js)の負荷試験結果。
  # ユーザー依頼「NW slb 負荷かけツールって知ってます？」→「k6をこの
  # ラボに統合してほしい」への対応。tools/prometheus_exporter.pyが
  # --k6-results-dirでポーリングして公開する netlab_k6_* メトリクスを
  # 評価する。has_run==0(一度もk6を実行していない)状態での誤発火を
  # 防ぐため、Strixと同じくhas_runでゲートする。
  - name: k6-load-test
    rules:
      - alert: K6LoadTestHighErrorRate
        expr: netlab_k6_has_run == 1 and netlab_k6_http_req_failed_rate > 0.01
        labels:
          severity: critical
        annotations:
          summary: "直近のk6負荷試験でHTTPエラー率が1%を超えました"
      - alert: K6LoadTestHighLatencyP95
        expr: netlab_k6_has_run == 1 and netlab_k6_http_req_duration_ms{quantile="p95"} > 500
        labels:
          severity: warning
        annotations:
          summary: "直近のk6負荷試験でp95レイテンシが500msを超えました"
