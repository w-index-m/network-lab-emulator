global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'snmp-trap-receiver'
    static_configs:
      - targets: ['127.0.0.1:9162']
  # tools/prometheus_exporter.py。SNMPダッシュボード由来のメトリクスに
  # 加え、/api/pentest/runs 経由でStrixペンテストの実行状況
  # (netlab_strix_*、strix-pentestアラートルールが評価する)も公開する。
  - job_name: 'netlab-emulator'
    static_configs:
      - targets: ['127.0.0.1:9877']
