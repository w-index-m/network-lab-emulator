# Network Lab Emulator 監視スタック（Prometheus + Grafana）
#
# 使い方（Docker Desktop for Windows/Mac 前提）:
#   1. エミュレーターを起動: python app.py
#   2. Exporterを起動: python tools\prometheus_exporter.py
#      （Windowsなら tools\run_prometheus_exporter.bat でも可）
#   3. このディレクトリで: docker compose up -d
#   4. Grafana: http://localhost:3000 （admin / admin、初回パスワード変更あり）
#      Prometheusデータソースは自動プロビジョニング済み
#   5. Prometheus本体のUIは http://localhost:9090
#
# 停止: docker compose down
version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: netlab-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: netlab-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:
