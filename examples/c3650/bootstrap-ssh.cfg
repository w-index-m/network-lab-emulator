! ─────────────────────────────────────────────────────────────
! Catalyst 3650 SSH ブートストラップ（コンソールから一度だけ投入）
! これが済むと netmiko(cisco_ios) で tools/eveng_deploy.py が接続可能
! ─────────────────────────────────────────────────────────────
enable
configure terminal
!
hostname SW3650
ip domain-name lab.local
!
! 管理用IP（VLAN1 SVI。実網に合わせて変更）
interface Vlan1
 ip address 192.168.1.10 255.255.255.0
 no shutdown
!
! ローカルユーザ + enable
username admin privilege 15 secret cisco
enable secret cisco
!
! SSHv2 有効化（RSA 2048bit 鍵生成）
crypto key generate rsa modulus 2048
ip ssh version 2
!
line vty 0 15
 login local
 transport input ssh
!
! L3スイッチとしてOSPF等を動かすなら必須
ip routing
!
end
write memory
