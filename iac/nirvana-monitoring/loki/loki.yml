# 1台構成の Loki(ファイルに保存)。ポートは Grafana 版の Loki とぶつからないよう 3101
auth_enabled: false
server:
  http_listen_port: 3101
  grpc_listen_port: 9196
common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  reject_old_samples: false
  allow_structured_metadata: false
