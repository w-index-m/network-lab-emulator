# ヴァルハラ(Prometheus): snmp_exporter 経由で装置の IF-MIB・CPU・OSPF-MIB を読む
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: cisco-snmp          # ニルヴァーナの sources.prometheus.job と同じ名前
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /snmp
    params:
      module: [cisco_if]
      auth: [netlab_v2]
    file_sd_configs:
      - files: [/etc/prometheus/targets/*.yml]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9117

  - job_name: snmp-exporter
    static_configs:
      - targets: [127.0.0.1:9117]

  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9091]
