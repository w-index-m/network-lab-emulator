# snmp_exporter 設定(generator を使わず手書きした最小構成)
#
# Cisco の監視で定番の IF-MIB ifXTable(64bitカウンタ ifHCIn/OutOctets、
# 短縮名 ifName、description の ifAlias)と ifTable の状態、
# CISCO-PROCESS-MIB の CPU 使用率、sysUpTime を取る。
auths:
  netlab_v2:
    community: netlab-ro        # Cisco側: snmp-server community netlab-ro RO
    version: 2
  # SNMPv3(authPriv)。使うときは prometheus.yml の params.auth を [netlab_v3] にする。
  # Cisco側: snmp-server group NETLAB-V3 v3 priv
  #          snmp-server user netlab-v3 NETLAB-V3 v3 auth sha Netlab-Auth1 priv aes 128 Netlab-Priv1
  # (ラボ用の値。本番ではパスワードを変え、--config.expand-environment-variables と ${...} で渡す)
  netlab_v3:
    version: 3
    security_level: authPriv
    username: netlab-v3
    auth_protocol: SHA
    password: Netlab-Auth1
    priv_protocol: AES
    priv_password: Netlab-Priv1

modules:
  cisco_if:
    walk:
      - 1.3.6.1.2.1.2.2.1.7          # ifAdminStatus
      - 1.3.6.1.2.1.2.2.1.8          # ifOperStatus
      - 1.3.6.1.2.1.31.1.1.1.1       # ifName   (lookup用)
      - 1.3.6.1.2.1.31.1.1.1.6       # ifHCInOctets
      - 1.3.6.1.2.1.31.1.1.1.7       # ifHCInUcastPkts
      - 1.3.6.1.2.1.31.1.1.1.10      # ifHCOutOctets
      - 1.3.6.1.2.1.31.1.1.1.11      # ifHCOutUcastPkts
      - 1.3.6.1.2.1.31.1.1.1.15      # ifHighSpeed
      - 1.3.6.1.2.1.31.1.1.1.18      # ifAlias  (lookup用)
      - 1.3.6.1.4.1.9.9.109.1.1.1.1.8  # cpmCPUTotal5minRev
      - 1.3.6.1.2.1.14.10.1.3        # ospfNbrRtrId  (lookup用)
      - 1.3.6.1.2.1.14.10.1.6        # ospfNbrState  (OSPF-MIB: 1=down … 8=full)
    get:
      - 1.3.6.1.2.1.1.3.0            # sysUpTime
      - 1.3.6.1.2.1.14.1.1.0         # ospfRouterId
    metrics:
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: The time (in hundredths of a second) since the network management portion of the system was last re-initialized.
      - name: cpmCPUTotal5minRev
        oid: 1.3.6.1.4.1.9.9.109.1.1.1.1.8
        type: gauge
        help: The overall CPU busy percentage in the last 5 minute period
        indexes:
          - {labelname: cpmCPUTotalIndex, type: gauge}
      - name: ifAdminStatus
        oid: 1.3.6.1.2.1.2.2.1.7
        type: gauge
        help: The desired state of the interface (1=up,2=down,3=testing)
        indexes:
          - {labelname: ifIndex, type: gauge}
        lookups:
          - labels: [ifIndex]
            labelname: ifName
            oid: 1.3.6.1.2.1.31.1.1.1.1
            type: DisplayString
          - labels: [ifIndex]
            labelname: ifAlias
            oid: 1.3.6.1.2.1.31.1.1.1.18
            type: DisplayString
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: The current operational state of the interface (1=up,2=down)
        indexes:
          - {labelname: ifIndex, type: gauge}
        lookups:
          - labels: [ifIndex]
            labelname: ifName
            oid: 1.3.6.1.2.1.31.1.1.1.1
            type: DisplayString
          - labels: [ifIndex]
            labelname: ifAlias
            oid: 1.3.6.1.2.1.31.1.1.1.18
            type: DisplayString
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        help: The total number of octets received on the interface (64-bit)
        indexes:
          - {labelname: ifIndex, type: gauge}
        lookups:
          - labels: [ifIndex]
            labelname: ifName
            oid: 1.3.6.1.2.1.31.1.1.1.1
            type: DisplayString
          - labels: [ifIndex]
            labelname: ifAlias
            oid: 1.3.6.1.2.1.31.1.1.1.18
            type: DisplayString
      - name: ifHCInUcastPkts
        oid: 1.3.6.1.2.1.31.1.1.1.7
        type: counter
        help: The number of unicast packets received (64-bit)
        indexes:
          - {labelname: ifIndex, type: gauge}
        lookups:
          - labels: [ifIndex]
            labelname: ifName
            oid: 1.3.6.1.2.1.31.1.1.1.1
            type: DisplayString
          - labels: [ifIndex]
            labelname: ifAlias
            oid: 1.3.6.1.2.1.31.1.1.1.18
            type: DisplayString
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        help: The total number of octets transmitted out of the interface (64-bit)
        indexes:
          - {labelname: ifIndex, type: gauge}
        lookups:
          - labels: [ifIndex]
            labelname: ifName
            oid: 1.3.6.1.2.1.31.1.1.1.1
            type: DisplayString
          - labels: [ifIndex]
            labelname: ifAlias
            oid: 1.3.6.1.2.1.31.1.1.1.18
            type: DisplayString
      - name: ifHCOutUcastPkts
        oid: 1.3.6.1.2.1.31.1.1.1.11
        type: counter
        help: The number of unicast packets transmitted (64-bit)
        indexes:
          - {labelname: ifIndex, type: gauge}
        lookups:
          - labels: [ifIndex]
            labelname: ifName
            oid: 1.3.6.1.2.1.31.1.1.1.1
            type: DisplayString
          - labels: [ifIndex]
            labelname: ifAlias
            oid: 1.3.6.1.2.1.31.1.1.1.18
            type: DisplayString
      - name: ifHighSpeed
        oid: 1.3.6.1.2.1.31.1.1.1.15
        type: gauge
        help: An estimate of the interface current bandwidth in Mbps
        indexes:
          - {labelname: ifIndex, type: gauge}
        lookups:
          - labels: [ifIndex]
            labelname: ifName
            oid: 1.3.6.1.2.1.31.1.1.1.1
            type: DisplayString
          - labels: [ifIndex]
            labelname: ifAlias
            oid: 1.3.6.1.2.1.31.1.1.1.18
            type: DisplayString
      # ── OSPF-MIB(RFC 1850)。Cyber View の OSPF モードを実機監視でも出すために使う ──
      - name: ospfRouterId
        oid: 1.3.6.1.2.1.14.1.1
        type: InetAddressIPv4
        help: The Router ID of this OSPF router (value is 1, the ID is in the label)
      - name: ospfNbrState
        oid: 1.3.6.1.2.1.14.10.1.6
        type: gauge
        help: OSPF neighbor state (1=down 2=attempt 3=init 4=twoWay 5=exchangeStart 6=exchange 7=loading 8=full)
        indexes:
          - {labelname: ospfNbrIpAddr, type: InetAddressIPv4}
          - {labelname: ospfNbrAddressLessIndex, type: gauge}
        lookups:
          - labels: [ospfNbrIpAddr, ospfNbrAddressLessIndex]
            labelname: ospfNbrRtrId
            oid: 1.3.6.1.2.1.14.10.1.3
            type: InetAddressIPv4
