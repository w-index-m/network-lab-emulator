groups:
  - name: cisco-traffic
    rules:
      # SNMPで取れない(ルータ停止/コミュニティ不一致/ACL等)
      - alert: CiscoSnmpUnreachable
        expr: up{job="cisco-snmp"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.router }} ({{ $labels.instance }}) にSNMPで到達できない"

      # ICMP Redirect を送っている(同じセグメントにゲートウェイが2台あり、遠回りが起きている)。
      # 1回だけ(ホストが覚えれば止まる)でも気づけるよう、5分の増分で見る
      - alert: CiscoIcmpRedirectSent
        expr: increase(icmpOutRedirects{job="cisco-snmp"}[5m]) > 0
        for: 0m
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.router }} が ICMP Redirect を送信(5分で {{ $value | printf \"%.0f\" }} 回)"
          description: "ホストの既定ゲートウェイと、宛先への次ホップが同じセグメントにある。経路の見直しか、意図しないなら no ip redirects"

      # 管理上 up なのに運用状態が down (ケーブル断・対向shutdown等)
      - alert: CiscoInterfaceDown
        expr: ifAdminStatus{job="cisco-snmp"} == 1 and ifOperStatus{job="cisco-snmp"} == 2
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.router }} {{ $labels.ifName }} が down"

      # 帯域使用率 80% 超(ifHighSpeed は Mbps。同じラベル集合同士なので on() 不要)
      - alert: CiscoInterfaceHighUtilizationIn
        expr: 100 * 8 * rate(ifHCInOctets{job="cisco-snmp"}[2m]) / (ifHighSpeed{job="cisco-snmp"} * 1e6) > 80
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.router }} {{ $labels.ifName }} 受信使用率 {{ $value | printf \"%.1f\" }}%"
      - alert: CiscoInterfaceHighUtilizationOut
        expr: 100 * 8 * rate(ifHCOutOctets{job="cisco-snmp"}[2m]) / (ifHighSpeed{job="cisco-snmp"} * 1e6) > 80
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.router }} {{ $labels.ifName }} 送信使用率 {{ $value | printf \"%.1f\" }}%"

      # CPU 5分平均 90% 超
      - alert: CiscoHighCpu
        expr: cpmCPUTotal5minRev{job="cisco-snmp"} > 90
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.router }} のCPU使用率が {{ $value }}%"

      # OSPF 隣接が Full でない(OSPF-MIB ospfNbrState。表にあって Full 以外 = 確立途中/切れかけ)
      - alert: CiscoOspfNeighborNotFull
        expr: ospfNbrState{job="cisco-snmp"} < 8
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.router }} の OSPF 隣接 {{ $labels.ospfNbrRtrId }} ({{ $labels.ospfNbrIpAddr }}) が Full でない"

  # ── ヴァルハラ × ニルヴァーナ ──────────────────────────────
  # ニルヴァーナ(Cyber View)が /metrics で出す判断(netlab_*)を使う。発報した警報は
  # ニルヴァーナが取り込み、「警」の花に VALHALLA の花びらで出す(⑤)。
  - name: valhalla-nirvana
    rules:
      # 予測・平常時とのずれ(③)を軽くするための記録ルール
      - record: netlab:link_util:max
        expr: max by (a, b, host_a, host_b) (netlab_link_util)
      - record: netlab:link_util:avg1h
        expr: avg_over_time(netlab:link_util:max[1h])

      # ニルヴァーナが LINK DOWN と判断した状態が 1 分続いた
      - alert: NirvanaLinkDown
        expr: netlab_link_state == 3
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.host_a }} ⇄ {{ $labels.host_b }} がリンク断(ニルヴァーナ判定)"
      # 状態ボードのどれかの観点が異常のまま 5 分
      - alert: NirvanaHealthCritical
        expr: netlab_health_state{category!="overall"} == 2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "状態ボード {{ $labels.category }} が異常のまま 5 分"
      # このままの増え方だと 7 日以内に使用率 80% に届く
      - alert: NirvanaLinkCapacityForecast
        expr: predict_linear(netlab:link_util:max[1h], 7 * 86400) > 0.8 and netlab:link_util:max < 0.8
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host_a }} ⇄ {{ $labels.host_b }} の使用率が 7 日以内に 80% に届く見込み"
      # OSPF の SPF 計算が 5 分で 5 回以上(経路が落ち着かない)
      - alert: NirvanaOspfSpfChurn
        expr: increase(netlab_ospf_spf_runs_total[5m]) >= 5
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.device }} で SPF 計算が頻発({{ $value | printf \"%.0f\" }} 回/5分)"
