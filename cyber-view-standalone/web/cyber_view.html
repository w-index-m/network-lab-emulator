<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber View</title>
<style>
  :root {
    --bg: #02060f; --ink: #bfe9ff; --dim: #4f7896; --cyan: #33d6ff; --red: #ff3b4e;
    --orange: #ffab2e; --panel: rgba(6, 20, 40, .72); --line: rgba(51, 214, 255, .35);
  }
  /* 3Dビューは常に暗い背景で描くため、ライトモードでも同じ配色を使う */
  :root[data-theme="light"], :root[data-theme="dark"] { --bg: #02060f; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #02060f; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "SFMono-Regular", Consolas, "Menlo", "Noto Sans Mono CJK JP", monospace; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  canvas.drag { cursor: grabbing; }
  #demoCap { display: none; left: 50%; transform: translateX(-50%); top: 58px; padding: 6px 14px; border: 1px solid rgba(255,171,46,0.6);
    background: rgba(20,10,0,0.7); color: #ffd9a0; font: 600 14px sans-serif; border-radius: 4px; z-index: 6; white-space: nowrap; }
  #demoCap b { color: #ffab2e; letter-spacing: 0.15em; margin-right: 8px; }
  #demoCap button { margin-left: 10px; background: none; border: 1px solid rgba(255,171,46,0.6); color: #ffab2e; cursor: pointer; border-radius: 3px; }
  body.demo #demoCap { display: block; }
  #mDemo.on { color: #ffab2e; }
  #zoom { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  #zoom button { width: 38px; height: 38px; border: 1px solid rgba(51,214,255,0.45); background: rgba(4,14,28,0.72); color: #8fe9ff;
    font: 700 18px/1 sans-serif; cursor: pointer; border-radius: 4px; }
  #zoom button:hover { background: rgba(51,214,255,0.18); }
  #bgToast { position: fixed; right: 64px; top: 50%; transform: translateY(70px); padding: 4px 10px; font-size: 12px; color: #fff;
    background: rgba(4,14,28,0.8); border: 1px solid rgba(51,214,255,0.45); opacity: 0; transition: opacity .3s; pointer-events: none; }
  #bgmToast { position: fixed; right: 64px; top: 50%; transform: translateY(110px); padding: 4px 10px; font-size: 12px; color: #fff;
    background: rgba(4,14,28,0.8); border: 1px solid rgba(255,171,46,0.55); opacity: 0; transition: opacity .3s; pointer-events: none; }
  #bgmToast.show { opacity: 1; }
  #zoom button.on { color: #3dff9a; border-color: rgba(61,255,154,0.55); }
  /* 起動演出(FX がオンのとき、タブを開いて最初の1回だけ) */
  #boot { position: fixed; inset: 0; z-index: 30; pointer-events: none; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #04122a 0%, #02060f 72%); transition: opacity .6s ease; }
  #boot.gone { opacity: 0; }
  #bootLog { min-width: min(520px, 88vw); font: 13px/1.75 monospace; color: #33d6ff; text-shadow: 0 0 8px rgba(51,214,255,.7); white-space: pre; }
  #bootLog .big { font-size: 22px; letter-spacing: .32em; color: #e8f7ff; margin: 6px 0; }
  #bootLog .ok { color: #3dff9a; } #bootLog .wait { color: #ffab2e; }
  /* 照準カーソルを出している間は、矢印の代わりに十字 */
  body.fxon canvas { cursor: crosshair; } body.fxon canvas.drag { cursor: grabbing; }
  /* 端末の配色: 画面全体を単色の端末風にする(赤・橙・緑の色分けは明るさの差だけになる) */
  :root[data-term="green"] { filter: grayscale(1) sepia(1) hue-rotate(62deg) saturate(3.2) brightness(.95); }
  :root[data-term="amber"] { filter: grayscale(1) sepia(1) hue-rotate(-8deg) saturate(4) brightness(.95); }
  :root[data-term="red"] { filter: grayscale(1) sepia(1) hue-rotate(-48deg) saturate(5) brightness(.9); }
  body.showlist:not(.links) #zoom { right: calc(min(300px, 44vw) + 28px); }
  body.showlist.links #zoom { right: calc(min(380px, 46vw) + 28px); }
  .hud { position: fixed; pointer-events: none; z-index: 2; }
  .hud * { pointer-events: auto; }
  #status { top: 12px; left: 16px; font-size: 13px; line-height: 1.55; text-shadow: 0 0 6px #000; }
  #status b { color: #fff; font-weight: 600; }
  #status .brand { font-size: 15px; letter-spacing: .32em; color: var(--cyan); position: relative;
    text-shadow: 0 0 8px rgba(51,214,255,.8), 0 0 18px rgba(51,214,255,.35); animation: cvBrand 6s infinite steps(1); }
  @keyframes cvBrand {
    0%, 91%, 100% { text-shadow: 0 0 8px rgba(51,214,255,.8), 0 0 18px rgba(51,214,255,.35); transform: none; }
    92% { text-shadow: -2px 0 #ff2a4a, 2px 0 #33d6ff; transform: translateX(1px) skewX(-8deg); }
    94% { text-shadow: 2px 0 #ff2a4a, -2px 0 #33d6ff; transform: translateX(-2px); }
    96% { opacity: .55; }
  }
  @media (prefers-reduced-motion: reduce) { #status .brand { animation: none; } }
  #status a { color: var(--dim); text-decoration: none; margin-right: 10px; }
  #status a:hover { color: var(--cyan); }
  #cidr { top: 6px; right: 18px; text-align: right; font-size: clamp(26px, 5.4vw, 64px); font-weight: 700;
    color: transparent; -webkit-text-stroke: 1.4px #e8f7ff; letter-spacing: .02em; white-space: nowrap; }
  #crumbs { top: clamp(44px, 7vw, 82px); right: 18px; font-size: 12px; color: var(--dim); text-align: right; }
  #crumbs span { cursor: pointer; color: var(--cyan); }
  #crumbs span:hover { text-decoration: underline; }
  #crumbs button { margin-left: 8px; background: transparent; color: var(--ink); border: 1px solid var(--line);
    font: inherit; padding: 2px 8px; cursor: pointer; }
  #filter { left: 16px; bottom: 14px; font-size: clamp(18px, 3.2vw, 30px); font-weight: 700; display: flex;
    align-items: center; gap: 10px; }
  #filter input { width: 7.5em; background: transparent; border: 0; border-bottom: 1px solid var(--line);
    color: #fff; font: inherit; padding: 0 2px; }
  #filter input::placeholder { color: #e8f7ff; opacity: .95; }
  #filter .arrow { color: var(--cyan); }
  #legend { left: 16px; bottom: clamp(52px, 7vw, 66px); font-size: 11px; color: var(--dim); }
  #legend i { display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 10px; vertical-align: -1px; }
  #alerts { top: 120px; right: 16px; width: min(300px, 44vw); font-size: 12px; }
  #alerts .a { background: var(--panel); border-left: 3px solid var(--red); padding: 5px 8px; margin-bottom: 5px;
    cursor: pointer; }
  #alerts .a.medium { border-color: var(--orange); }
  #alerts .a.low { border-color: #ffe14d; }
  #alerts .a.warning { border-color: #ffab2e; }
  #alerts .a.warning b { color: #ffab2e; }
  #alerts .a.info { border-color: #33d6ff; }
  #alerts .a.info b { color: #33d6ff; }
  #alerts .a small { color: var(--dim); display: block; }
  #card { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, 88vw);
    background: rgba(4, 14, 30, .86); border: 1px solid var(--cyan); box-shadow: 0 0 24px rgba(51, 214, 255, .35);
    padding: 12px 14px; font-size: 12px; display: none; }
  #card h2 { margin: 0 0 4px; font-size: 18px; color: #fff; letter-spacing: .04em; }
  #card .sub { color: var(--dim); margin-bottom: 8px; }
  #card table { width: 100%; border-collapse: collapse; }
  #card td { padding: 2px 4px; border-top: 1px solid rgba(51, 214, 255, .12); white-space: nowrap; }
  #card td.up { color: #5dffa8; } #card td.down { color: var(--red); }
  #card .stat { display: flex; justify-content: space-between; margin-top: 8px; color: var(--dim); }
  #card .stat b { color: #fff; }
  #session { right: 16px; bottom: 14px; width: min(600px, calc(100vw - 32px)); display: none;
    background: rgba(4, 14, 30, .8); border: 1px solid var(--line); font-size: 12px; }
  #session .hd { padding: 4px 10px; background: rgba(51, 214, 255, .14); color: #fff; letter-spacing: .1em; }
  #session .row { display: grid; grid-template-columns: 70px 1fr 1fr 70px 40px; gap: 6px; padding: 2px 10px; }
  #session .row .ng { color: var(--red); } #session .row .ok { color: #5dffa8; }
  #modes { top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 0; font-size: 12px; }
  #modes button { background: rgba(4,14,30,.7); color: var(--dim); border: 1px solid var(--line); padding: 5px 14px;
    font: inherit; letter-spacing: .14em; cursor: pointer; }
  #modes button.on { color: #02060f; background: var(--cyan); border-color: var(--cyan); font-weight: 700; }
  #linkbar { top: 46px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--dim); display: none;
    white-space: nowrap; }
  #linkbar select { background: #061428; color: var(--ink); border: 1px solid var(--line); font: inherit; }
  #linkbar .src { color: #fff; border: 1px solid var(--line); padding: 1px 6px; margin-left: 6px; }
  #linkbar .src.prom { color: #ffab2e; border-color: #ffab2e; }
  #linkpanel { top: 120px; right: 16px; width: min(380px, 46vw); max-height: calc(100vh - 150px); overflow: auto;
    display: none; font-size: 12px; }
  #linkpanel .l { background: var(--panel); border-left: 4px solid #5dffa8; padding: 6px 8px; margin-bottom: 6px; cursor: pointer; }
  #linkpanel .l.warn { border-color: #ffab2e; } #linkpanel .l.crit, #linkpanel .l.down { border-color: #ff3b4e; }
  #linkpanel .l.sel { outline: 1px solid var(--cyan); }
  #linkpanel .top { display: flex; justify-content: space-between; color: #fff; }
  #linkpanel .st { font-weight: 700; letter-spacing: .08em; }
  #linkpanel .st.ok { color: #5dffa8; } #linkpanel .st.warn { color: #ffab2e; } #linkpanel .st.crit, #linkpanel .st.down { color: #ff3b4e; }
  #linkpanel .bps { display: grid; grid-template-columns: 1fr 1fr; color: var(--ink); margin-top: 3px; }
  #linkpanel .bar { height: 4px; background: rgba(51,214,255,.15); margin-top: 4px; }
  #linkpanel .bar i { display: block; height: 100%; background: var(--cyan); }
  #linkpanel canvas { width: 100%; height: 26px; position: static; display: block; margin-top: 4px; cursor: inherit; }
  #linkpanel small { color: var(--dim); }
  body.links #alerts, body.links #filter, body.links #crumbs, body.links #card, body.links #session, body.links #legend { display: none !important; }
  body.links #linkbar { display: block; }
  /* ヴァルハラの再生バー */
  #vhOpen { margin-left: 8px; background: #2a1a55; color: #e6dcff; border: 1px solid #8f6dff; font: inherit; padding: 1px 8px; cursor: pointer; }
  #vhbar { display: none; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(980px, calc(100vw - 24px));
    background: rgba(14,8,34,.86); border: 1px solid #8f6dff; padding: 8px 12px; font-size: 12px; color: #e6dcff; }
  body.vhopen.links:not(.ospf) #vhbar { display: block; }
  #vhbar select, #vhbar button { background: #1d1240; color: #e6dcff; border: 1px solid #6f55c8; font: inherit; padding: 1px 6px; }
  #vhSlider { width: min(360px, 40vw); vertical-align: middle; accent-color: #b69bff; }
  #vhState { color: #b9a8ee; margin-top: 4px; }
  #vhEvents button { margin: 4px 4px 0 0; font-size: 11px; }
  #vhEvents button.bad { border-color: #ff3b4e; color: #ffb0b8; } #vhEvents button.good { border-color: #5dffa8; color: #b6ffd8; }
  body.replaying #cidr { color: #c8b3ff; }
  body.replaying canvas { filter: hue-rotate(25deg) saturate(1.1); }
  /* OSPF モード: 宛先の選択と凡例 */
  body.ospf #linkbar { display: none !important; }
  #ospfbar { top: 46px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--dim); display: none;
    white-space: nowrap; text-align: center; }
  body.ospf #ospfbar { display: block; }
  #ospfbar select { background: #061428; color: var(--ink); border: 1px solid var(--line); font: inherit; }
  #ospfbar .lg { margin-left: 10px; } #ospfbar .lg i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin: 0 4px 0 8px; }
  #ospfbar .areas b { margin-left: 8px; }
  /* DARKNET モード(NICTER のエッセンス): 使われていない帯に届いた通信 */
  body.dark #linkbar, body.dark #linkpanel, body.dark #ospfbar { display: none !important; }
  #darkbar { top: 46px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--dim); display: none; white-space: nowrap; text-align: center; }
  body.dark #darkbar { display: block; }
  #darkbar input { background: #061428; color: var(--ink); border: 1px solid var(--line); font: inherit; width: 150px; }
  #darkbar button { background: #1a0f2e; color: #e6dcff; border: 1px solid #8f6dff; font: inherit; padding: 1px 8px; cursor: pointer; }
  #darkbar .lg i { display: inline-block; width: 16px; height: 4px; vertical-align: middle; margin: 0 4px 0 8px; }
  #darkpanel { top: 120px; right: 88px; width: min(340px, 42vw); max-height: calc(100vh - 150px); overflow: auto; display: none; font-size: 12px; }
  body.dark #darkpanel { display: block; }
  #darkpanel h4 { margin: 0 0 6px; color: #fff; letter-spacing: .1em; font-size: 12px; }
  #darkpanel .box { background: var(--panel); border: 1px solid var(--line); padding: 8px; margin-bottom: 8px; }
  #darkpanel table { width: 100%; border-collapse: collapse; color: var(--ink); }
  #darkpanel th { color: var(--dim); font-weight: 400; text-align: right; padding: 2px 4px; border-bottom: 1px solid var(--line); }
  #darkpanel td { text-align: right; padding: 2px 4px; font-family: monospace; }
  #darkpanel th:first-child, #darkpanel td:first-child { text-align: left; }
  #darkpanel .cat { display: grid; grid-template-columns: 9em 1fr 3em; gap: 4px; align-items: center; margin: 3px 0; }
  #darkpanel .cat i { display: block; height: 7px; } #darkpanel .cat b { text-align: right; font-family: monospace; color: #fff; }
  #darkpanel .ev { font-family: monospace; font-size: 11px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 640px) { #darkpanel { top: auto; bottom: 60px; right: 8px; width: 70vw; max-height: 34vh; } #darkbar input { width: 110px; } }
  #aipanel { top: 120px; right: 88px; width: min(440px, 46vw); max-height: calc(100vh - 150px); overflow: auto; display: none; font-size: 12px; z-index: 30;
    background: rgba(8,4,24,.94); border: 1px solid #9b4dff; padding: 10px; box-shadow: 0 0 24px rgba(155,77,255,.35); }
  body.ai #aipanel { display: block; } body.ai #worldpanel { display: none; }
  #aipanel h4 { margin: 8px 0 4px; color: #e6d6ff; letter-spacing: .08em; font-size: 12px; }
  #aipanel .row { display: flex; gap: 4px; margin: 4px 0; flex-wrap: wrap; align-items: center; }
  #aipanel select, #aipanel button { background: rgba(20,8,40,.9); color: #e6d6ff; border: 1px solid #6b3fd0; padding: 3px 8px; font: 12px sans-serif; cursor: pointer; }
  #aipanel button.go { background: #6b3fd0; color: #fff; }
  #aipanel .f { border-left: 3px solid var(--dim); padding: 3px 6px; margin: 4px 0; background: rgba(255,255,255,.03); }
  #aipanel .f.critical, #aipanel .f.high { border-color: #ff3b4e; } #aipanel .f.medium { border-color: #ffab2e; } #aipanel .f.low, #aipanel .f.info { border-color: #4fe3ff; }
  #aipanel pre { margin: 3px 0; padding: 4px 6px; background: rgba(0,0,0,.45); color: #c9f7ff; white-space: pre-wrap; font: 11px monospace; }
  #aipanel .risk { font-size: 10px; padding: 0 4px; border: 1px solid; margin-left: 4px; }
  #aipanel .risk.read { color: #5dffa8; } #aipanel .risk.caution { color: #ffab2e; } #aipanel .risk.blocked { color: #ff3b4e; }
  #aipanel .dim { color: var(--dim); }
  @media (max-width: 640px) { #aipanel { top: auto; bottom: 60px; right: 8px; width: 92vw; max-height: 50vh; } }
  #worldpanel { top: 120px; right: 88px; width: min(360px, 42vw); max-height: calc(100vh - 150px); overflow: auto; display: none; font-size: 12px; }
  body.world #worldpanel { display: block; }
  #worldpanel h4 { margin: 0 0 6px; color: #fff; letter-spacing: .1em; font-size: 12px; }
  #worldpanel .box { background: var(--panel); border: 1px solid var(--line); padding: 8px; margin-bottom: 8px; }
  #worldpanel table { width: 100%; border-collapse: collapse; color: var(--ink); }
  #worldpanel th { color: var(--dim); font-weight: 400; text-align: right; padding: 2px 4px; border-bottom: 1px solid var(--line); }
  #worldpanel td { text-align: right; padding: 2px 4px; font-family: monospace; }
  #worldpanel th:first-child, #worldpanel td:first-child { text-align: left; }
  #worldpanel .ev { font-family: monospace; font-size: 11px; color: var(--ink); margin: 2px 0; }
  #worldpanel .ok { color: #5dffa8; } #worldpanel .warn { color: #ffab2e; } #worldpanel .ng { color: #ff3b4e; } #worldpanel .off { color: var(--dim); }
  #worldpanel .row { display: flex; gap: 4px; margin: 4px 0; }
  #worldpanel input { flex: 1; min-width: 0; background: rgba(4,14,30,.8); color: var(--ink); border: 1px solid var(--line); padding: 3px 6px; font: 12px monospace; }
  #worldpanel button { background: rgba(4,14,30,.8); color: var(--cyan); border: 1px solid var(--line); padding: 3px 10px; cursor: pointer; }
  @media (max-width: 640px) { #worldpanel { top: auto; bottom: 60px; right: 8px; width: 70vw; max-height: 34vh; } }
  /* ATT&CK モード(NIRVANA改 Organizations View 風): 組織の輪 + 進行度の円柱 + 戦術×手法の表 */
  body.atk #linkbar, body.atk #linkpanel, body.atk #ospfbar, body.atk #darkbar, body.atk #darkpanel { display: none !important; }
  #atkpanel { left: 12px; right: 12px; bottom: 10px; max-height: 40vh; overflow: auto; display: none; font-size: 11px; }
  body.atk #atkpanel { display: block; }
  body.atk #resp { bottom: calc(40vh + 20px); }
  #atkpanel .mx { display: grid; grid-template-columns: repeat(14, minmax(78px, 1fr)); gap: 3px; }
  #atkpanel .th { background: rgba(10,30,60,.85); border-top: 2px solid #33d6ff; padding: 3px 4px; color: #fff; text-align: center; line-height: 1.25; }
  #atkpanel .th small { display: block; color: var(--dim); font-size: 9px; }
  #atkpanel .th.hit { border-color: #ff9a3d; background: rgba(70,30,6,.9); }
  #atkpanel .col { display: flex; flex-direction: column; gap: 3px; }
  #atkpanel .tq { background: rgba(255,140,40,.18); border: 1px solid #ff9a3d; padding: 3px 4px; color: #ffe2c4; }
  #atkpanel .tq b { color: #fff; font-family: monospace; } #atkpanel .tq small { display: block; color: #ffc48a; }
  #atkpanel .tl { margin-top: 6px; color: var(--ink); font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #atkpanel .tl span { color: #ff9a3d; }
  @media (max-width: 640px) { #atkpanel { max-height: 34vh; } }
  /* WAN モード(回線チェック): CPE ⇄ フレッツ網の出口、経路ごとの遅延・ロス */
  body.wan #linkbar, body.wan #linkpanel, body.wan #ospfbar, body.wan #darkbar, body.wan #darkpanel, body.wan #atkpanel { display: none !important; }
  #wanpanel { top: 120px; right: 88px; width: min(380px, 44vw); max-height: calc(100vh - 150px); overflow: auto; display: none; font-size: 12px; }
  body.wan #wanpanel { display: block; }
  #wanpanel .box { background: var(--panel); border: 1px solid var(--line); padding: 8px; margin-bottom: 8px; }
  #wanpanel h4 { margin: 0 0 4px; color: #fff; font-size: 12px; letter-spacing: .08em; display: flex; justify-content: space-between; }
  #wanpanel .row { color: var(--ink); font-family: monospace; font-size: 11px; margin: 2px 0; }
  #wanpanel .ok { color: #5dffa8; } #wanpanel .warn { color: #ffab2e; } #wanpanel .bad { color: #ff3b4e; }
  #wanpanel canvas { width: 100%; height: 34px; display: block; margin-top: 3px; position: static; }
  /* 試験の様子(Claude が裏で回している試験)。試験が動いている間と、終わってから 60 秒だけ出す */
  #testpanel { left: 16px; bottom: clamp(96px, 11vw, 116px); width: min(340px, 64vw); display: none; font-size: 11px;
    background: rgba(14,8,34,.86); border: 1px solid #a98bff; padding: 7px 9px; box-shadow: 0 0 16px rgba(169,139,255,.25); }
  body.testing #testpanel { display: block; }
  body.board #testpanel, body.atk #testpanel { display: none !important; }
  #testpanel h4 { margin: 0 0 4px; color: #fff; font-size: 12px; letter-spacing: .08em; display: flex; justify-content: space-between; gap: 8px; }
  #testpanel h4 small { color: #c9b8ff; font-weight: 400; letter-spacing: 0; }
  #testpanel .cnt { font-family: monospace; margin-bottom: 4px; } #testpanel .cnt b { margin-right: 10px; }
  #testpanel .ev { font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  #testpanel .p { color: #3dff9a; } #testpanel .f { color: #ff3b4e; } #testpanel .s { color: #9aa4b8; } #testpanel .q { color: #c9b8ff; }
  @media (max-width: 640px) { #wanpanel { top: auto; bottom: 60px; right: 8px; width: 70vw; max-height: 34vh; } }
  /* RESPONSE: 警報からの遮断・隔離 */
  #resp { bottom: 64px; left: 50%; transform: translateX(-50%); width: min(620px, 92vw); font-size: 12px; display: none; }
  body.respon #resp { display: block; }
  #resp .box { background: rgba(28,6,16,.88); border: 1px solid #ff3b4e; box-shadow: 0 0 18px rgba(255,59,78,.35); padding: 8px 10px; }
  #resp h4 { margin: 0 0 4px; color: #ff8a96; letter-spacing: .12em; font-size: 12px; display: flex; justify-content: space-between; }
  #resp button { background: #2a0a14; color: #ffd6db; border: 1px solid #ff6b7a; font: inherit; padding: 3px 8px; margin: 3px 4px 0 0; cursor: pointer; text-align: left; }
  #resp button.undo { border-color: #5dffa8; color: #c8ffe2; background: #08261a; }
  #resp button.x { border: none; background: none; color: var(--dim); padding: 0 4px; margin: 0; }
  #resp .act { color: var(--ink); margin-top: 4px; } #resp .act small { color: var(--dim); }
  #resp pre { margin: 4px 0 0; color: #9fe9ff; font-size: 11px; white-space: pre-wrap; max-height: 90px; overflow: auto; }
  #resp label { margin-right: 10px; color: var(--dim); } #resp input { vertical-align: middle; }
  body.board #resp { display: none !important; }
  /* BOARD / EXPLORE / ALERTS: 3D は後ろで暗く動かし、その上にホログラムのパネルを並べる */
  body.board #cv { filter: brightness(.3) saturate(1.2) blur(1.5px); }
  body.board #crumbs, body.board #alerts, body.board #card, body.board #session, body.board #legend, body.board #filter,
  body.board #linkbar, body.board #ospfbar, body.board #vhbar, body.board #empty, body.board #linkpanel, body.board #cidr,
  body.board #zoom, body.board #bgToast, body.board #bgmToast { display: none !important; }
  /* 右脇の文字リストは既定で隠し、画面内の立体表示で見せる(LIST ボタンで出せる) */

  body.showlist.links #linkpanel { display: block !important; }
  #tip { position: fixed; z-index: 3; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
    padding: 4px 8px; font-size: 12px; display: none; white-space: nowrap; }
  #empty { left: 50%; top: 58%; transform: translateX(-50%); color: var(--dim); font-size: 13px; text-align: center;
    display: none; }
  /* 中くらいの幅では上のメニューが左の状態表示・右の CIDR と重なるので、メニューを詰めて CIDR をメニューの下へ */
  @media (min-width: 641px) and (max-width: 1800px) {

<script>
(() => {
  'use strict';
  const SESSION_KEY = 'netlabToken_v1';      // index.html / dashboard.html と同じキー
  let token = null;
  try { token = localStorage.getItem(SESSION_KEY); } catch (e) { token = null; }
  // スタンドアロン版: URL の ?token=... でも受け取る(以後はブラウザに保存)
  try {
    const qt = new URLSearchParams(location.search).get('token');
    if (qt) { token = qt; try { localStorage.setItem(SESSION_KEY, qt); } catch (e) { /* 保存できなくても使う */ } }
  } catch (e) { /* 古いブラウザ */ }
  // データ元の画面上の呼び名。メトリクス収集基盤(Prometheus)はこの画面では「ヴァルハラ」と呼ぶ
  // (接続先・環境変数 PROMETHEUS_URL・API の項目名は Prometheus のまま)
  const SRC_DISPLAY = { prometheus: 'VALHALLA', mixed: 'VALHALLA+IF COUNTER' };
  const dispSrc = (v) => String(v).split('+').map(x => SRC_DISPLAY[x] || x.toUpperCase()).join('+');
  const api = (path) => fetch(path, { headers: token ? { 'X-Session-Token': token } : {} })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
  }
  window.addEventListener('resize', resize); resize();

  // ── データ ─────────────────────────────────────
  const S = 1.15, HALF = 0.5;              // パネル間隔とパネル半幅
  let hosts = [], hostById = {}, ipOwner = {}, links = [];
  let events = [];                          // 直近のフロー(最大3000)
  let alerts = [];                          // 直近のアラート
  let seq = 0, alertSeq = 0, primed = false, flowTotal = 0;
  let particles = [];

  const octets = (ip) => ip.split('.').map(Number);
  const RULE_CODE = { valhalla: 'VH', nirvana_rule: 'RULE', conn_scan: 'PSCAN', scan: 'SCAN', unreach_burst: 'UNRCH', flood: 'FLOOD', large_icmp: 'MTU', link_down: 'LINK', snmp_lost: 'SNMP', fw_shun: 'SHUN', syslog_error: 'ERR',
    if_flap: 'IF FLAP', ospf_flap: 'OSPF FLAP', bgp_flap: 'BGP FLAP', eigrp_flap: 'EIGRP FLAP', fhrp_flap: 'FHRP FLAP',
    stp_tc_flap: 'STP TC', stp_root_flap: 'STP ROOT', mac_flap: 'MAC FLAP', errdisable_flap: 'ERRDIS', route_flap: 'RT FLAP',
    cpu_high: 'CPU HIGH', wan_slow: 'WAN SLOW', wan_loss: 'WAN LOSS' };
  const SEV_COL = { high: '#ff3b4e', medium: '#ffab2e', warning: '#ffab2e', low: '#ffe14d' };

  // ── 表示状態: prefix = 選んだオクテット列 (長さ0〜3) / host = ホストビュー ──
  let prefix = [], hostView = null;          // hostView = {id, ip}
  const cam = { yaw: -0.55, pitch: 0.72, dist: 33, tdist: 33, px: 0, pz: 0, bob: 0 };
  let autoSpin = true;                       // 操作していない時にゆっくり回す
  let lastInput = performance.now();

  function levelCidr() {
    if (hostView) return hostView.ip + '/32';
    const o = prefix.concat([0, 0, 0, 0]).slice(0, 4);
    return o.join('.') + '/' + (prefix.length * 8);
  }
  function inBlock(ip) {
    const o = octets(ip);
    for (let i = 0; i < prefix.length; i++) if (o[i] !== prefix[i]) return false;
    return true;
  }
  function panelXZ(n) {                      // 0..255 → 床面の座標(0が奥の左)
    const i = n % 16, j = Math.floor(n / 16);
    return [(i - 7.5) * S, (7.5 - j) * S];
  }
  function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
  function outsidePoint(ip) {                // 今のブロック外の相手は外周の上空から飛んでくる
    const a = (hash(ip.split('.').slice(0, prefix.length + 1).join('.')) % 360) * Math.PI / 180;
    return [Math.cos(a) * 15, 6.5, Math.sin(a) * 15];
  }
  function posForIp(ip) {
    if (!ip) return null;
    if (hostView) return null;
    if (!inBlock(ip)) return outsidePoint(ip);
    const [x, z] = panelXZ(octets(ip)[prefix.length]);
    return [x, prefix.length === 3 ? 0.9 : 0.15, z];
  }
  function devIp(dev) { const h = hostById[dev]; return h ? h.interfaces[0].ip : null; }

  // ── 描画の基本: 透視投影 ─────────────────────────
  function proj(x, y, z) {
    x -= cam.px; z -= cam.pz;                // パン(視点の中心を床の上でずらす)
    const pt = cam.pitch + cam.bob;
    const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(pt), sp = Math.sin(pt);
    const x1 = x * cy - z * sy, z1 = x * sy + z * cy;
    const y2 = y * cp + z1 * sp, z2 = -y * sp + z1 * cp;
    const d = z2 + cam.dist;
    if (d < 0.5) return null;
    const f = Math.min(W, H * 1.25) * 1.05, s = f / d;
    return { x: W / 2 + x1 * s, y: H * 0.54 - y2 * s, s, d };
  }
  function poly(pts) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath(); }
  function hexPath(cx, cy, r) {
    ctx.beginPath();
    for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; const px = cx + r * Math.cos(a), py = cy + r * Math.sin(a); k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.closePath();
  }

  // ── パネル集計(装置数・直近の通信量・アラート) ──
  function panelStats(now) {
    const st = {};
    const get = (n) => st[n] || (st[n] = { hosts: [], bytes: 0, ng: 0, alerts: [] });
    const L = prefix.length;
    for (const h of hosts) for (const itf of h.interfaces) {
      if (inBlock(itf.ip)) get(octets(itf.ip)[L]).hosts.push({ h, itf });
    }
    for (const e of events) {
      if (now - e.t > 30) continue;
      for (const ip of [e.src_ip, e.dst_ip]) {
        if (ip && inBlock(ip)) { const p = get(octets(ip)[L]); p.bytes += e.bytes; if (!e.ok) p.ng++; }
      }
    }
    for (const a of alerts) {
      if (now - a.t > 600) continue;
      const ip = devIp(a.src) || (a.dst && /^\d+\.\d+\.\d+\.\d+$/.test(a.dst) ? a.dst : devIp(a.dst));
      if (ip && inBlock(ip)) get(octets(ip)[L]).alerts.push(a);
    }
    return st;
  }

  // ── Network View (/0〜/24) ───────────────────────
  let pickables = [];
  function drawNetwork(t, nowSec) {
    const L = prefix.length;
    const st = panelStats(nowSec);
    const maxB = Math.max(1, ...Object.values(st).map(p => p.bytes));
    const panels = [];
    for (let n = 0; n < 256; n++) {
      const [x, z] = panelXZ(n);
      const c = proj(x, 0, z);
      if (c) panels.push({ n, x, z, d: c.d });
    }
    panels.sort((a, b) => b.d - a.d);
    pickables = [];

    // サブネットを球で囲む(NIRVANA改 図2): 裏側のタイルと球の枠はパネルより先に描く
    let subAlerts = [], subFlows = 0;
    if (L === 3) {
      for (const k in st) { subAlerts = subAlerts.concat(st[k].alerts); }
      subFlows = events.filter(e => nowSec - e.t < 30 && ((e.src_ip && inBlock(e.src_ip)) || inBlock(e.dst_ip))).length;
      alertLevel = subAlerts.length;
      drawSphere(SUB_R, t, subAlerts.length ? 'rgba(255,60,60,0.16)' : 'rgba(51,214,255,0.13)', 0, 0);
      drawShell(t, subAlerts, false);
    } else {
      alertLevel = Object.values(st).reduce((a, p) => a + p.alerts.length, 0);
    }

    for (const p of panels) {
      const info = st[p.n];
      // 立体感: パネルを厚みのある板にする(装置のいるパネルは厚く)、遠いものは霧で薄く
      const TH = info && info.hosts.length ? 0.32 : 0.1;
      const SQ = [[-HALF, HALF], [HALF, HALF], [HALF, -HALF], [-HALF, -HALF]];
      const corners = SQ.map(([dx, dz]) => proj(p.x + dx, TH, p.z + dz));
      const base = SQ.map(([dx, dz]) => proj(p.x + dx, 0, p.z + dz));
      if (corners.some(c => !c) || base.some(c => !c)) continue;
      ctx.globalAlpha = fog(p.d);
      const sides = [0, 1, 2, 3].map(k => ({ q: [base[k], base[(k + 1) % 4], corners[(k + 1) % 4], corners[k]],
        d: (base[k].d + base[(k + 1) % 4].d) / 2 })).sort((a, b) => b.d - a.d);
      const hot = info && info.alerts.length, occ = info && info.hosts.length;
      for (const sd of sides) {
        poly(sd.q);
        ctx.fillStyle = hot ? 'rgba(110,10,25,0.75)' : occ ? 'rgba(20,80,150,0.8)' : 'rgba(8,30,60,0.55)';
        ctx.fill();
        ctx.strokeStyle = hot ? 'rgba(255,60,80,0.35)' : 'rgba(51,214,255,0.12)'; ctx.lineWidth = 0.6; ctx.stroke();
      }
      let fill = 'rgba(30,110,220,0.07)', stroke = 'rgba(51,214,255,0.22)';
      if (info && info.hosts.length) { fill = 'rgba(40,150,255,0.30)'; stroke = 'rgba(120,230,255,0.85)'; }
      if (info && info.bytes) {
        const k = Math.min(1, 0.25 + Math.log10(1 + info.bytes) / Math.log10(1 + maxB) * 0.75);
        fill = `rgba(${Math.round(60 + 160 * k)},${Math.round(190 + 60 * k)},255,${0.25 + 0.45 * k})`;
      }
      if (info && info.alerts.length) { stroke = '#ff3b4e'; fill = 'rgba(255,40,70,0.35)'; }
      poly(corners); ctx.fillStyle = fill; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = stroke; ctx.stroke();
      pickables.push({ n: p.n, poly: corners, info });

      // パネルのラベル(オクテット)を床面に貼る
      const c0 = corners[0], c1 = corners[1], c3 = corners[3];
      if (Math.abs(c1.x - c0.x) + Math.abs(c1.y - c0.y) > 16) {
        ctx.save();
        ctx.setTransform(DPR * (c1.x - c0.x) / 100, DPR * (c1.y - c0.y) / 100,
                         DPR * (c3.x - c0.x) / 100, DPR * (c3.y - c0.y) / 100, DPR * c0.x, DPR * c0.y);
        ctx.fillStyle = info && info.hosts.length ? '#ffffff' : 'rgba(150,200,230,0.55)';
        ctx.font = '600 30px monospace'; ctx.textBaseline = 'top';
        ctx.fillText(String(p.n), 8, 6);
        if (L === 3 && info && info.hosts.length) {
          ctx.font = '22px monospace'; ctx.fillStyle = '#bfe9ff';
          ctx.fillText(info.hosts[0].h.hostname.slice(0, 7), 8, 44);
        } else if (info && info.hosts.length) {
          ctx.font = '20px monospace'; ctx.fillStyle = '#bfe9ff';
          ctx.fillText(info.hosts.length + ' host', 8, 58);
        }
        ctx.restore();
      }
      // /24では装置を柱で立てる(高さ=直近の通信量)
      if (L === 3 && info && info.hosts.length) {
        const h = 0.4 + (info.bytes ? 2.2 * Math.log10(1 + info.bytes) / Math.log10(1 + maxB) : 0);
        const top = [[-0.3, 0.3], [0.3, 0.3], [0.3, -0.3], [-0.3, -0.3]].map(([dx, dz]) => proj(p.x + dx, TH + h, p.z + dz));
        const bot = [[-0.3, 0.3], [0.3, 0.3], [0.3, -0.3], [-0.3, -0.3]].map(([dx, dz]) => proj(p.x + dx, TH, p.z + dz));
        if (!top.some(v => !v)) {
          ctx.strokeStyle = info.alerts.length ? 'rgba(255,80,100,0.9)' : 'rgba(140,235,255,0.85)';
          ctx.fillStyle = info.alerts.length ? 'rgba(255,60,80,0.18)' : 'rgba(60,200,255,0.16)';
          for (let k = 0; k < 4; k++) {
            const q = [bot[k], bot[(k + 1) % 4], top[(k + 1) % 4], top[k]];
            poly(q); ctx.fill(); ctx.stroke();
          }
          poly(top); ctx.fill(); ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
    // アラートの花
    // 隣り合うパネルの花が重ならないよう、高さを3段に振り分ける
    let fi = 0;
    for (const p of panels) {
      const info = st[p.n];
      if (info && info.alerts.length) drawFlower(p.x, p.z, info.alerts, t, 4.6 + (fi++ % 3) * 2.8);
    }
    if (L === 3) { drawShell(t, subAlerts, true); drawSparks(t, subAlerts.length, subFlows); }
    // SNMP に応答しない装置(Prometheus の up=0)の上に「NO RESPONSE 消失」
    const lostDevs = ((health && health.categories.find(c => c.key === 'network')) || {}).unreachable || [];
    for (const u of lostDevs) {
      const ip = devIp(u.id);
      if (!ip || !inBlock(ip)) continue;
      const [x, z] = panelXZ(octets(ip)[L]);
      plate3d(x, 3.2, z, STATE_COL.lost, 'NO RESPONSE', '消失', true, t, u.hostname);
    }
    // 直近30秒に通信のあったブロック/装置の上に、状態と量の立体プレート(上位6件)
    const busy = Object.entries(st).filter(([, v]) => v.bytes > 0).sort((a, b) => b[1].bytes - a[1].bytes).slice(0, 6);
    // 隣り合うパネルのプレートが重ならないよう、パネル番号順に左右へ扇状に振り分ける
    const order = busy.map(([n]) => +n).sort((a, b) => a - b);
    busy.forEach(([n, v], i) => {
      const [x, z] = panelXZ(+n);
      const ok = !v.ng, col = ok ? '#3dff9a' : '#ffab2e';
      const top = L === 3 ? 0.32 + 0.4 + (v.bytes ? 2.2 * Math.log10(1 + v.bytes) / Math.log10(1 + maxB) : 0) : 0.4;
      const k = order.indexOf(+n), ox = (k - (order.length - 1) / 2) * 190;
      plate3d(x, top + 1.6 + (k % 2) * 0.7, z, col, ok ? 'NORMAL' : `NG ×${v.ng}`, fmtShort(v.bytes * 8 / 30), false, t,
              L === 3 && v.hosts.length ? v.hosts[0].h.hostname : null, ox);
    });
    document.getElementById('empty').style.display = Object.keys(st).length ? 'none' : 'block';
  }

  // ── 図2の雰囲気: 地平線までの床グリッド・球面の六角タイル・球内の火の粉 ──
  const SUB_R = 13.6;
  let alertLevel = 0;
  function drawFloor() {
    const E = 70, step = 2.3;
    for (let k = -E; k <= E; k += step) {
      for (const horiz of [true, false]) {
        const a = horiz ? proj(-E, -0.02, k) : proj(k, -0.02, -E), b = horiz ? proj(E, -0.02, k) : proj(k, -0.02, E);
        if (!a || !b) continue;
        ctx.strokeStyle = `rgba(120,140,160,${Math.max(0.03, Math.min(0.16, 3 / (a.d + b.d) * 2))})`;
        ctx.lineWidth = 0.7;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
  }
  // 球面を覆う六角タイル(フィボナッチ球で配置)。アラート1件ごとに重要度に応じた枚数を赤く灯す
  const TILES = (() => {
    const N = 120, out = [], ga = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const y = 1 - (i + 0.5) / N * 2, r = Math.sqrt(1 - y * y), a = i * ga;
      const n = [Math.cos(a) * r, y, Math.sin(a) * r];
      let u = [-n[2], 0, n[0]]; const ul = Math.hypot(u[0], u[2]) || 1; u = [u[0] / ul, 0, u[2] / ul];
      const v = [n[1] * u[2] - n[2] * u[1], n[2] * u[0] - n[0] * u[2], n[0] * u[1] - n[1] * u[0]];
      out.push({ n, u, v });
    }
    return out;
  })();
  function litTiles(list) {
    const lit = new Map();
    const per = { high: 7, medium: 4, warning: 3, low: 2 };
    for (const a of list) {
      let h = hash(String(a.seq) + a.rule);
      for (let k = 0; k < (per[a.severity] || 3); k++) {
        const idx = h % TILES.length;
        if (!lit.has(idx)) lit.set(idx, a);
        h = Math.imul(h ^ (h >>> 13), 2654435761) >>> 0;
      }
    }
    return lit;
  }
  function drawShell(t, list, front) {
    const lit = litTiles(list), o = proj(0, 0, 0);
    if (!o) return;
    const r = SUB_R * 0.16;
    TILES.forEach((tl, i) => {
      const c = [tl.n[0] * SUB_R, tl.n[1] * SUB_R, tl.n[2] * SUB_R];
      const pc = proj(...c);
      if (!pc || (pc.d < o.d) !== front) return;
      const a = lit.get(i);
      if (!a && !list.length) return;
      const pts = [];
      for (let k = 0; k < 6; k++) {
        const ang = Math.PI / 6 + k * Math.PI / 3, cs = Math.cos(ang) * r, sn = Math.sin(ang) * r;
        const p = proj(c[0] + tl.u[0] * cs + tl.v[0] * sn, c[1] + tl.u[1] * cs + tl.v[1] * sn, c[2] + tl.u[2] * cs + tl.v[2] * sn);
        if (!p) return;
        pts.push(p);
      }
      const k = front ? 1 : 0.45;
      poly(pts);
      if (a) {
        const pulse = 0.75 + 0.25 * Math.sin(t * 0.004 + i);
        ctx.fillStyle = `rgba(200,20,30,${0.22 * k * pulse})`; ctx.fill();
        ctx.strokeStyle = `rgba(255,70,70,${0.75 * k})`; ctx.lineWidth = 1.4; ctx.stroke();
        // タイルの面に「警」とルール名を貼る
        const ex = proj(c[0] + tl.u[0] * r * 0.6, c[1] + tl.u[1] * r * 0.6, c[2] + tl.u[2] * r * 0.6);
        const ey = proj(c[0] - tl.v[0] * r * 0.6, c[1] - tl.v[1] * r * 0.6, c[2] - tl.v[2] * r * 0.6);
        if (ex && ey && Math.hypot(ex.x - pc.x, ex.y - pc.y) > 6) {
          ctx.save();
          ctx.setTransform(DPR * (ex.x - pc.x) / 50, DPR * (ex.y - pc.y) / 50, DPR * (ey.x - pc.x) / 50, DPR * (ey.y - pc.y) / 50, DPR * pc.x, DPR * pc.y);
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          const wn = a.severity === 'warning';
          ctx.fillStyle = wn ? `rgba(255,160,40,${0.9 * k})` : `rgba(255,60,60,${0.9 * k})`; ctx.font = '700 46px sans-serif'; ctx.fillText(wn ? '注' : '警', 0, -12);
          ctx.fillStyle = wn ? `rgba(255,200,140,${0.9 * k})` : `rgba(255,140,140,${0.9 * k})`; ctx.font = '600 17px monospace'; ctx.fillText(RULE_CODE[a.rule] || a.rule, 0, 30);
          ctx.restore();
        }
      } else {
        ctx.strokeStyle = `rgba(255,60,60,${0.07 * k})`; ctx.lineWidth = 1; ctx.stroke();
      }
    });
  }
  // 球の中を漂う火の粉。数はアラートと直近の通信量で増える
  let sparks = [];
  function drawSparks(t, nAlerts, nFlows) {
    const want = Math.min(260, 25 + nAlerts * 30 + nFlows * 4);
    while (sparks.length < want) {
      const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, rr = Math.cbrt(Math.random()) * SUB_R * 0.92, q = Math.sqrt(1 - u * u);
      sparks.push({ x: Math.cos(a) * q * rr, y: u * rr, z: Math.sin(a) * q * rr,
        vx: (Math.random() - 0.5) * 0.01, vy: 0.004 + Math.random() * 0.01, vz: (Math.random() - 0.5) * 0.01, ph: Math.random() * 6 });
    }
    if (sparks.length > want) sparks.length = want;
    const hot = nAlerts > 0;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const sp of sparks) {
      sp.x += sp.vx; sp.y += sp.vy; sp.z += sp.vz;
      if (sp.x * sp.x + sp.y * sp.y + sp.z * sp.z > SUB_R * SUB_R * 0.85) { sp.y = -SUB_R * 0.6; sp.x *= 0.5; sp.z *= 0.5; }
      const p = proj(sp.x, sp.y, sp.z);
      if (!p) continue;
      const rad = Math.max(1.2, Math.min(5, p.s * 0.09)) * (0.7 + 0.3 * Math.sin(t * 0.005 + sp.ph));
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad * 3);
      g.addColorStop(0, hot ? 'rgba(255,220,120,0.95)' : 'rgba(170,240,255,0.7)');
      g.addColorStop(0.35, hot ? 'rgba(255,140,30,0.55)' : 'rgba(51,214,255,0.3)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(p.x - rad * 3, p.y - rad * 3, rad * 6, rad * 6);
    }
    ctx.restore();
  }

  function fog(d) { return Math.max(0.3, Math.min(1, 1.35 - (d - cam.dist) / (cam.dist * 0.75))); }

  // ── 状態ボード: ネットワーク / トラフィック / セキュリティ / syslog ──
  let health = null;
  const H_COL = { ok: '#3dff9a', warn: '#ffab2e', crit: '#ff3b4e' };
  const H_JA = { ok: '正常', warn: '注意', crit: '異常' };
  const H_ICON = { network: 'NET', traffic: 'TRF', security: 'SEC', syslog: 'LOG' };
  async function pollHealth() {
    try { health = await api('/api/traffic/health?window=300'); } catch (e) { /* 次の周期で再試行 */ }
  }
  function hexPrism(cx, cy, r, col, t) {
    // 押し出した六角柱(上面+手前の側面)で立体に見せる
    const depth = r * 0.45;
    const pts = Array.from({ length: 6 }, (_, k) => { const a = k * Math.PI / 3; return [cx + r * Math.cos(a), cy + r * Math.sin(a) * 0.62]; });
    for (let k = 0; k < 6; k++) {
      const a = pts[k], b = pts[(k + 1) % 6];
      if (a[1] + b[1] < 2 * cy) continue;               // 手前側の面だけ
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(b[0], b[1] + depth); ctx.lineTo(a[0], a[1] + depth); ctx.closePath();
      ctx.fillStyle = col + '55'; ctx.fill(); ctx.strokeStyle = col + 'aa'; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
    ctx.fillStyle = col + '33'; ctx.fill();
    ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 12 + 6 * Math.sin(t * 0.004); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  }
  function fit(text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    while (text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1);
    return text + '…';
  }
  function drawBoard(t) {
    if (!health || mode === 'atk') return;      // ATT&CK は下の表と重なるので出さない
    const compact = W < 640;
    ctx.save();
    if (compact) {
      const y0 = 78, w = (W - 24) / 4;
      health.categories.forEach((c, i) => {
        const x = 12 + i * w, col = H_COL[c.state];
        ctx.fillStyle = 'rgba(4,14,30,0.78)'; ctx.fillRect(x + 2, y0, w - 4, 40);
        ctx.fillStyle = col; ctx.fillRect(x + 2, y0, w - 4, 3);
        ctx.fillStyle = '#9fc6dd'; ctx.font = '10px monospace'; ctx.fillText(c.label, x + 6, y0 + 16);
        ctx.fillStyle = col; ctx.font = '700 15px sans-serif'; ctx.fillText(H_JA[c.state], x + 6, y0 + 34);
      });
      ctx.restore(); return;
    }
    const x0 = 16, y0 = 150, w = 318, rowH = 70;
    // 奥へ少し傾けたホログラム板
    ctx.setTransform(DPR, -0.035 * DPR, 0, DPR, 0, 0);
    const hgt = 48 + rowH * health.categories.length;
    const g = ctx.createLinearGradient(x0, y0, x0 + w, y0);
    g.addColorStop(0, 'rgba(6,24,48,0.86)'); g.addColorStop(1, 'rgba(6,24,48,0.35)');
    ctx.fillStyle = g; ctx.fillRect(x0, y0, w, hgt);
    ctx.fillStyle = 'rgba(51,214,255,0.10)'; ctx.fillRect(x0 + w, y0 + 6, 6, hgt);            // 板の厚み
    ctx.fillRect(x0 + 6, y0 + hgt, w, 6);
    ctx.strokeStyle = H_COL[health.overall]; ctx.lineWidth = 1.2; ctx.strokeRect(x0, y0, w, hgt);
    for (let yy = y0 + 2; yy < y0 + hgt; yy += 3) { ctx.fillStyle = 'rgba(255,255,255,0.018)'; ctx.fillRect(x0, yy, w, 1); }  // 走査線
    ctx.fillStyle = '#e8f7ff'; ctx.font = '600 12px monospace';
    ctx.fillText(`SYSTEM STATUS  ・ 直近${Math.round(health.window / 60)}分`, x0 + 10, y0 + 20);
    const srcs = health.sources || {};
    ctx.fillStyle = '#7fb2d0'; ctx.font = '10px monospace';
    // ラボ版は internal(エミュレータの IF カウンタ/内部ログ)、スタンドアロン版は prometheus/zabbix/loki 等
    const srcName = (v, internal) => !v || v === 'internal' ? internal : dispSrc(v);
    ctx.fillText(`METRICS: ${srcName(srcs.metrics, 'IF COUNTER')}  LOGS: ${srcName(srcs.logs, 'INTERNAL')}`, x0 + 10, y0 + hgt - 6);
    ctx.fillStyle = H_COL[health.overall]; ctx.font = '700 13px sans-serif';
    ctx.fillText('総合 ' + H_JA[health.overall], x0 + w - 74, y0 + 20);
    health.categories.forEach((c, i) => {
      const y = y0 + 34 + i * rowH, col = H_COL[c.state];
      hexPrism(x0 + 30, y + 22, 17, col, t + i * 300);
      ctx.fillStyle = '#fff'; ctx.font = '700 10px monospace'; ctx.textAlign = 'center';
      ctx.fillText(H_ICON[c.key] || '', x0 + 30, y + 26); ctx.textAlign = 'start';
      ctx.fillStyle = '#bfe9ff'; ctx.font = '12px sans-serif'; ctx.fillText(c.label, x0 + 60, y + 14);
      ctx.fillStyle = col; ctx.font = '700 22px sans-serif'; ctx.fillText(H_JA[c.state], x0 + 60, y + 38);
      ctx.fillStyle = '#9fc6dd'; ctx.font = '11px sans-serif';
      ctx.fillText(fit(c.summary, w - 128), x0 + 118, y + 30);
      if (c.details && c.details.length && c.state !== 'ok') {
        ctx.fillStyle = col; ctx.font = '10px sans-serif';
        const d = c.details[c.details.length - 1].trim();
        ctx.fillText(fit(d, w - 128), x0 + 118, y + 46);
      }
      if (i < health.categories.length - 1) { ctx.fillStyle = 'rgba(51,214,255,0.12)'; ctx.fillRect(x0 + 10, y + rowH - 6, w - 20, 1); }
    });
    ctx.restore();
  }
  // 床に描く総合状態のリング(シーンの中に「正常/注意/異常」を出す)
  function drawGroundRing(t) {
    if (!health) return;
    const col = H_COL[health.overall], R = 16.5;
    ctx.save();
    for (const [rr, w, a] of [[R, 3, 0.85], [R + 0.6, 1, 0.4], [R - 0.6, 1, 0.4]]) {
      ctx.beginPath(); let f = true;
      for (let k = 0; k <= 120; k++) {
        const ang = k / 120 * Math.PI * 2 + (rr === R ? t * 0.0002 : 0);
        const p = proj(Math.cos(ang) * rr, 0.01, Math.sin(ang) * rr);
        if (!p) { f = true; continue; }
        f ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); f = false;
      }
      ctx.strokeStyle = col; ctx.globalAlpha = a; ctx.lineWidth = w; ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.stroke();
    }
    // 目盛り
    ctx.globalAlpha = 0.7; ctx.lineWidth = 2;
    for (let k = 0; k < 48; k++) {
      const ang = k / 48 * Math.PI * 2 - t * 0.0002;
      const a = proj(Math.cos(ang) * (R + 0.9), 0.01, Math.sin(ang) * (R + 0.9)), b = proj(Math.cos(ang) * (R + 1.5), 0.01, Math.sin(ang) * (R + 1.5));
      if (a && b) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
    // リングの手前に床に貼った文字
    // 画面の右方向へ文字が流れ、下がカメラ側を向くように床に貼る
    const sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw);
    const nx = [-sy, -cy], tx = [cy, -sy];
    // 手前側は画面外に出やすいので、奥側のリングの外に(カメラ向きで読める向きに)置く
    const c = [-nx[0] * (R + 3.4), -nx[1] * (R + 3.4)];
    const p0 = proj(c[0], 0.02, c[1]), p1 = proj(c[0] + tx[0], 0.02, c[1] + tx[1]), p2 = proj(c[0] + nx[0], 0.02, c[1] + nx[1]);
    if (p0 && p1 && p2) {
      ctx.globalAlpha = 0.95; ctx.shadowBlur = 18;
      ctx.setTransform(DPR * (p1.x - p0.x) / 20, DPR * (p1.y - p0.y) / 20, DPR * (p2.x - p0.x) / 20, DPR * (p2.y - p0.y) / 20, DPR * p0.x, DPR * p0.y);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = col;
      ctx.font = '800 22px sans-serif';
      ctx.fillText(`SYSTEM ${H_JA[health.overall]}`, 0, 0);
    }
    ctx.restore();
  }

  function drawSphere(R, t, color, cx, cz) {
    ctx.strokeStyle = color; ctx.lineWidth = 1;
    for (let lat = -60; lat <= 60; lat += 30) {
      const y = R * Math.sin(lat * Math.PI / 180), r = R * Math.cos(lat * Math.PI / 180);
      ctx.beginPath(); let first = true;
      for (let a = 0; a <= 360; a += 8) {
        const p = proj(cx + r * Math.cos(a * Math.PI / 180), y, cz + r * Math.sin(a * Math.PI / 180));
        if (!p) { first = true; continue; }
        first ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); first = false;
      }
      ctx.stroke();
    }
    for (let k = 0; k < 12; k++) {
      const lon = k * Math.PI / 6 + t * 0.00008;
      ctx.beginPath(); let first = true;
      for (let a = -90; a <= 90; a += 8) {
        const r = R * Math.cos(a * Math.PI / 180), y = R * Math.sin(a * Math.PI / 180);
        const p = proj(cx + r * Math.cos(lon), y, cz + r * Math.sin(lon));
        if (!p) { first = true; continue; }
        first ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); first = false;
      }
      ctx.stroke();
    }
  }

  // ── アラートの花(図9風): 中央の赤い「警」+ 検知元ごとの白い花びら + 黄色の多重六角 + コイルの柱 ──
  const SOURCES = {
    IDS: { label: 'IDS', sub: '侵入検知', col: '#1f6fd1' },
    FW: { label: 'FW', sub: 'ファイアウォール', col: '#d8402a' },
    SYSLOG: { label: 'SYSLOG', sub: 'ログ', col: '#3a4450' },
    NET: { label: 'NET', sub: 'リンク監視', col: '#d98a00' },
    VALHALLA: { label: 'VALHALLA', sub: 'ヴァルハラの警報', col: '#6b3fd0' },
    RULE: { label: 'RULES', sub: 'ボードのアラートルール', col: '#0f8f7a' },
    DARKNET: { label: 'DARKNET', sub: 'ダークネット観測', col: '#4a2a7a' },
    NEXUS: { label: 'NEXUS', sub: '複数拠点の横断分析', col: '#1f8fbf' },

    LOOP: { label: 'LOOP', sub: 'L2ループ', col: '#e0402e' },
    WORLD: { label: 'WORLD', sub: 'インターネット全体(IHR・Radar)', col: '#2a8fd8' },
    AI: { label: 'AI', sub: 'AI のログ解析', col: '#9b4dff' },
  };
  const SOURCE_OF = { conn_scan: 'IDS', scan: 'IDS', unreach_burst: 'IDS', flood: 'IDS', large_icmp: 'IDS',
    fw_shun: 'FW', syslog_error: 'SYSLOG', link_down: 'NET', route_flap: 'NET', valhalla: 'VALHALLA', nirvana_rule: 'RULE',
    darknet_scan: 'DARKNET', darknet_backscatter: 'DARKNET', darknet_misconfig: 'DARKNET', darknet_reflection: 'DARKNET',
    login_brute: 'IDS', login_after_fail: 'IDS', exfil: 'IDS', nexus_finding: 'NEXUS', ext_sensor: 'SENSOR', l2_loop: 'LOOP',
    ihr_outage: 'WORLD', ihr_delay: 'WORLD', radar_anomaly: 'WORLD', ai_finding: 'AI' };
  function drawIcon(src, x, y, s) {
    const c = SOURCES[src].col;
    ctx.save(); ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = Math.max(1.2, s * 0.09);
    if (src === 'IDS') {                     // レーダー
      for (const k of [1, 0.66, 0.33]) { ctx.beginPath(); ctx.arc(x, y, s * 0.5 * k, Math.PI, Math.PI * 2); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s * 0.35, y - s * 0.36); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + s * 0.2, y - s * 0.2, s * 0.07, 0, Math.PI * 2); ctx.fill();
    } else if (src === 'FW') {               // レンガの壁
      const w = s * 0.9, h = s * 0.55, x0 = x - w / 2, y0 = y - h * 0.8;
      ctx.lineWidth = Math.max(1, s * 0.06);
      ctx.strokeRect(x0, y0, w, h);
      for (let r = 1; r < 3; r++) { ctx.beginPath(); ctx.moveTo(x0, y0 + h * r / 3); ctx.lineTo(x0 + w, y0 + h * r / 3); ctx.stroke(); }
      for (let r = 0; r < 3; r++) for (let k = 1; k < 3; k++) {
        const bx = x0 + w * (k / 3 + (r % 2 ? 0.16 : 0)); ctx.beginPath(); ctx.moveTo(bx, y0 + h * r / 3); ctx.lineTo(bx, y0 + h * (r + 1) / 3); ctx.stroke();
      }
    } else if (src === 'VALHALLA') {         // 館(三角屋根と柱)
      const w = s * 0.82, h = s * 0.62, x0 = x - w / 2, y0 = y - h * 0.55;
      ctx.lineWidth = Math.max(1, s * 0.07);
      ctx.beginPath(); ctx.moveTo(x0 - s * 0.05, y0); ctx.lineTo(x, y0 - s * 0.32); ctx.lineTo(x0 + w + s * 0.05, y0); ctx.closePath(); ctx.fill();
      for (let k = 0; k < 4; k++) { const bx = x0 + w * (0.12 + k * 0.25); ctx.fillRect(bx - s * 0.04, y0 + s * 0.04, s * 0.08, h * 0.72); }
      ctx.fillRect(x0 - s * 0.05, y0 + h * 0.8, w + s * 0.1, s * 0.08);
    } else if (src === 'RULE') {             // 計器(ボードのルール)
      ctx.lineWidth = Math.max(1, s * 0.08);
      ctx.beginPath(); ctx.arc(x, y - s * 0.05, s * 0.4, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y - s * 0.05); ctx.lineTo(x + s * 0.26, y - s * 0.33); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y - s * 0.05, s * 0.07, 0, Math.PI * 2); ctx.fill();
    } else if (src === 'SENSOR') {           // 盾(他社のセキュリティ製品)
      ctx.lineWidth = Math.max(1, s * 0.07);
      ctx.beginPath(); ctx.moveTo(x, y - s * 0.55); ctx.lineTo(x + s * 0.36, y - s * 0.42); ctx.lineTo(x + s * 0.3, y - s * 0.05);
      ctx.quadraticCurveTo(x + s * 0.18, y + s * 0.12, x, y + s * 0.2); ctx.quadraticCurveTo(x - s * 0.18, y + s * 0.12, x - s * 0.3, y - s * 0.05);
      ctx.lineTo(x - s * 0.36, y - s * 0.42); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - s * 0.13, y - s * 0.18); ctx.lineTo(x - s * 0.02, y - s * 0.06); ctx.lineTo(x + s * 0.16, y - s * 0.3); ctx.stroke();
    } else if (src === 'NEXUS') {            // 結ばれた3つの拠点
      const pts = [[0, -0.42], [-0.38, 0.2], [0.38, 0.2]].map(([a, b]) => [x + a * s, y - s * 0.15 + b * s]);
      ctx.lineWidth = Math.max(1, s * 0.06);
      ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.stroke();
      for (const p of pts) { ctx.beginPath(); ctx.arc(p[0], p[1], s * 0.12, 0, Math.PI * 2); ctx.fill(); }
    } else if (src === 'DARKNET') {          // 蜘蛛の巣(ダークネット)
      ctx.lineWidth = Math.max(1, s * 0.05);
      const cx = x, cy = y - s * 0.2, R = s * 0.42;
      for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a)); ctx.stroke(); }
      for (const r of [0.35, 0.68, 1]) { ctx.beginPath(); for (let k = 0; k <= 8; k++) { const a = k * Math.PI / 4; const px = cx + R * r * Math.cos(a), py = cy + R * r * Math.sin(a); k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.stroke(); }
    } else if (src === 'WORLD') {            // 地球(経線と緯線)
      ctx.lineWidth = Math.max(1, s * 0.06);
      const cx = x, cy = y - s * 0.2, R = s * 0.36;
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx, cy, R * 0.45, R, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.stroke();
    } else if (src === 'AI') {               // 回路のチップ(AI)
      ctx.lineWidth = Math.max(1, s * 0.06);
      const cx = x, cy = y - s * 0.2, h = s * 0.26;
      ctx.strokeRect(cx - h, cy - h, h * 2, h * 2);
      for (const k of [-0.5, 0, 0.5]) {
        ctx.beginPath(); ctx.moveTo(cx + k * h * 1.4, cy - h); ctx.lineTo(cx + k * h * 1.4, cy - h * 1.5);
        ctx.moveTo(cx + k * h * 1.4, cy + h); ctx.lineTo(cx + k * h * 1.4, cy + h * 1.5); ctx.stroke();
      }
      ctx.font = `bold ${Math.round(s * 0.26)}px sans-serif`; ctx.textAlign = 'center'; ctx.fillText('AI', cx, cy + s * 0.09);
    } else if (src === 'LOOP') {             // ぐるぐる回る矢印(ループ)
      ctx.lineWidth = Math.max(1.2, s * 0.08);
      const cx = x, cy = y - s * 0.2, R = s * 0.32;
      for (const a0 of [0, Math.PI]) {
        ctx.beginPath(); ctx.arc(cx, cy, R, a0 + 0.25, a0 + Math.PI - 0.25); ctx.stroke();
        const ax = cx + R * Math.cos(a0 + Math.PI - 0.25), ay = cy + R * Math.sin(a0 + Math.PI - 0.25);
        const dir = a0 + Math.PI - 0.25 + Math.PI / 2;
        ctx.beginPath(); ctx.moveTo(ax + Math.cos(dir) * s * 0.14, ay + Math.sin(dir) * s * 0.14);
        ctx.lineTo(ax + Math.cos(dir + 2.4) * s * 0.14, ay + Math.sin(dir + 2.4) * s * 0.14);
        ctx.lineTo(ax + Math.cos(dir - 2.4) * s * 0.14, ay + Math.sin(dir - 2.4) * s * 0.14); ctx.closePath(); ctx.fill();
      }
    } else if (src === 'SYSLOG') {           // ログの書類
      const w = s * 0.6, h = s * 0.72, x0 = x - w / 2, y0 = y - h * 0.85;
      ctx.lineWidth = Math.max(1, s * 0.06); ctx.strokeRect(x0, y0, w, h);
      for (let r = 1; r <= 4; r++) { ctx.beginPath(); ctx.moveTo(x0 + w * 0.15, y0 + h * r / 5); ctx.lineTo(x0 + w * (r % 2 ? 0.85 : 0.6), y0 + h * r / 5); ctx.stroke(); }
    } else {                                 // 切れたリンク
      ctx.beginPath(); ctx.arc(x - s * 0.32, y - s * 0.2, s * 0.13, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + s * 0.32, y - s * 0.2, s * 0.13, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - s * 0.2, y - s * 0.2); ctx.lineTo(x - s * 0.06, y - s * 0.2);
      ctx.moveTo(x + s * 0.06, y - s * 0.2); ctx.lineTo(x + s * 0.2, y - s * 0.2); ctx.stroke();
      ctx.strokeStyle = '#e0202e'; ctx.beginPath(); ctx.moveTo(x - s * 0.09, y - s * 0.36); ctx.lineTo(x + s * 0.09, y - s * 0.04);
      ctx.moveTo(x + s * 0.09, y - s * 0.36); ctx.lineTo(x - s * 0.09, y - s * 0.04); ctx.stroke();
    }
    ctx.restore();
  }
  function drawFlower(x, z, list, t, height) {
    const H0 = height || 4.6;
    // コイル(重ねた輪)の柱でパネルと花を結ぶ
    for (let k = 0, n = Math.max(6, Math.round(H0 / 0.28)); k <= n; k++) {
      const y = k / n * H0, rr = 0.42;
      ctx.beginPath(); let f = true;
      for (let a = 0; a <= 360; a += 30) {
        const p = proj(x + rr * Math.cos(a * Math.PI / 180), y, z + rr * Math.sin(a * Math.PI / 180));
        if (!p) { f = true; continue; }
        f ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); f = false;
      }
      const lit = Math.abs(((t * 0.0015) % 1) - k / n) < 0.08;
      ctx.strokeStyle = lit ? 'rgba(255,255,255,0.95)' : 'rgba(120,220,255,0.45)'; ctx.lineWidth = lit ? 1.6 : 1; ctx.stroke();
    }
    const c = proj(x, H0 + 0.5, z);
    if (!c) return;
    const r = Math.max(13, Math.min(46, c.s * 0.75));
    // 検知元ごとにまとめる
    const bySrc = {};
    for (const a of list) { let sname = a.source || SOURCE_OF[a.rule] || 'IDS'; if (!SOURCES[sname]) sname = 'IDS'; (bySrc[sname] = bySrc[sname] || []).push(a); }
    const srcs = Object.keys(bySrc).sort((a, b) => bySrc[b].length - bySrc[a].length);
    // 黄色の多重六角(ゆっくり脈動)
    ctx.save();
    for (let k = 0; k < 7; k++) {
      hexPath(c.x, c.y, r * (2.75 + k * 0.09 + 0.03 * Math.sin(t * 0.003)));
      ctx.strokeStyle = `rgba(235,215,70,${0.55 - k * 0.07})`; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.restore();
    // 花びら(6枠。検知元が無い枠は暗い空き枠)
    for (let i = 0; i < 6; i++) {
      const ang = -Math.PI / 2 + i * Math.PI / 3;
      const px = c.x + Math.cos(ang) * r * 1.76, py = c.y + Math.sin(ang) * r * 1.76;
      const src = srcs[i];
      hexPath(px, py, r * 0.96);

      const items = bySrc[src];
      const sev = items.some(a => a.severity === 'high') ? 'high' : items.some(a => a.severity === 'medium' || a.severity === 'warning') ? 'medium' : 'low';
      const g = ctx.createLinearGradient(px, py - r, px, py + r);
      g.addColorStop(0, '#fbfcfd'); g.addColorStop(1, '#cdd5dd');
      ctx.fillStyle = g; ctx.fill();
      ctx.save(); ctx.shadowColor = SEV_COL[sev]; ctx.shadowBlur = 10; ctx.strokeStyle = SEV_COL[sev]; ctx.lineWidth = 2.2; ctx.stroke(); ctx.restore();
      drawIcon(src, px, py - r * 0.12, r * 0.62);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#1b2430'; ctx.font = `800 ${Math.max(8, r * 0.27)}px sans-serif`;
      ctx.fillText(SOURCES[src].label, px, py + r * 0.3);
      if (r > 20) {
        const rules = [...new Set(items.map(a => RULE_CODE[a.rule] || a.rule))].slice(0, 2).join('/');
        ctx.fillStyle = '#56606c'; ctx.font = `600 ${Math.max(7, r * 0.18)}px monospace`;
        ctx.fillText(`${rules} ×${items.length}`, px, py + r * 0.56);
      }
    }
    // 中央の「警」
    const pulse = 0.85 + 0.15 * Math.sin(t * 0.006);
    // 警告(フラップ)だけなら橙の「注」、1件でも警報があれば赤の「警」
    const W = list.length && list.every(a => a.severity === 'warning');
    const CC = W ? { a: `rgba(200,110,0,${pulse})`, b: 'rgba(70,35,0,0.96)', sh: '#ff9a1a', st: '#ffbe5c', in: 'rgba(255,190,110,0.35)', ch: '注', tx: 'rgba(255,225,180,0.7)', fl: '#ff9a1a', n: '#ffe6c4' }
                 : { a: `rgba(190,20,35,${pulse})`, b: 'rgba(70,0,8,0.96)', sh: '#ff2a3a', st: '#ff6a72', in: 'rgba(255,120,130,0.35)', ch: '警', tx: 'rgba(255,200,205,0.7)', fl: '#ff2236', n: '#ffd9dc' };
    hexPath(c.x, c.y, r);

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 ${r * 0.98}px sans-serif`;
    ctx.lineWidth = Math.max(1, r * 0.05); ctx.strokeStyle = CC.tx; ctx.strokeText(CC.ch, c.x, c.y - r * 0.06);
    ctx.fillStyle = CC.fl; ctx.fillText(CC.ch, c.x, c.y - r * 0.06);
    ctx.fillStyle = CC.n; ctx.font = `700 ${Math.max(8, r * 0.24)}px monospace`;
    ctx.fillText(list.length, c.x, c.y + r * 0.66);

  }

  // ── Host View (/32) ─────────────────────────────
  const SPHERE_R = 7.5;
  let peerPos = {};
  function hostPeers(id) {
    const h = hostById[id];
    const set = new Map();
    (h ? h.peers : []).forEach(p => set.set(p, { id: p, label: (hostById[p] || {}).hostname || p, ip: devIp(p) }));
    for (const e of events) {
      if (e.src === id) {
        const k = e.dst || e.dst_ip;
        if (!set.has(k)) set.set(k, { id: k, label: e.dst ? ((hostById[e.dst] || {}).hostname || e.dst) : 'unknown', ip: e.dst_ip });
      } else if (e.dst === id && e.src && !set.has(e.src)) {
        set.set(e.src, { id: e.src, label: (hostById[e.src] || {}).hostname || e.src, ip: e.src_ip });
      }
    }
    return [...set.values()].slice(0, 40);
  }
  function drawHost(t) {
    const id = hostView.id;
    drawSphere(SPHERE_R, t, 'rgba(51,214,255,0.22)', 0, 0);
    const peers = hostPeers(id);
    peerPos = {};
    const N = Math.max(peers.length, 1), ga = Math.PI * (3 - Math.sqrt(5));
    const list = peers.map((p, i) => {
      const y = 1 - (i + 0.5) / N * 1.6, r = Math.sqrt(1 - y * y), a = i * ga + 0.6;
      const pos = [Math.cos(a) * r * SPHERE_R, y * SPHERE_R * 0.8, Math.sin(a) * r * SPHERE_R];
      peerPos[p.id] = pos; if (p.ip) peerPos[p.ip] = pos;
      return { p, pos, c: proj(...pos) };
    }).filter(v => v.c).sort((a, b) => b.c.d - a.c.d);
    const o = proj(0, 0, 0);
    for (const { p, c } of list) {
      ctx.strokeStyle = 'rgba(51,214,255,0.28)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(c.x, c.y); ctx.stroke();
      const s = Math.max(5, c.s * 0.42);
      ctx.fillStyle = 'rgba(40,150,255,0.35)'; ctx.strokeStyle = '#8fe8ff';
      ctx.fillRect(c.x - s, c.y - s * 0.7, s * 2, s * 1.4); ctx.strokeRect(c.x - s, c.y - s * 0.7, s * 2, s * 1.4);
      ctx.fillStyle = '#fff'; ctx.font = `${Math.max(10, Math.min(13, c.s * 0.4))}px monospace`;
      ctx.fillText(p.label, c.x + s + 4, c.y - 2);
      ctx.fillStyle = '#7fb2d0'; ctx.fillText(p.ip || '', c.x + s + 4, c.y + 12);
    }
    const mine = alerts.filter(a => (a.src === id || a.dst === id || a.dst === hostView.ip) && Date.now() / 1000 - a.t < 600);
    if (mine.length) drawFlower(0, -SPHERE_R * 0.95, mine, t, SPHERE_R * 1.05);
    pickables = [];
  }

  function renderCard() {
    const card = document.getElementById('card'), sess = document.getElementById('session');
    if (!hostView) { card.style.display = sess.style.display = 'none'; return; }
    const h = hostById[hostView.id];
    if (!h) { card.style.display = 'none'; return; }
    const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const fmt = (b) => b > 1e9 ? (b / 1e9).toFixed(1) + 'G' : b > 1e6 ? (b / 1e6).toFixed(1) + 'M' : b > 1e3 ? (b / 1e3).toFixed(1) + 'k' : String(b);
    const mine = events.filter(e => e.src === h.id || e.dst === h.id || (e.path || []).includes(h.id));
    const ng = mine.filter(e => !e.ok).length;
    card.innerHTML = `<h2>${esc(h.hostname)}</h2><div class="sub">${esc(h.type)} ・ ${esc(h.id)}</div>
      <table>${h.interfaces.map(i => `<tr><td>${esc(i.name)}</td><td>${esc(i.ip)}/${i.prefix}</td>
        <td class="${i.up ? 'up' : 'down'}">${i.up ? 'UP' : 'DOWN'}</td>
        <td>in ${fmt(i.in_bytes)} / out ${fmt(i.out_bytes)}</td></tr>`).join('')}</table>
      <div class="stat"><span>Flows <b>${mine.length}</b></span><span>NG <b>${ng}</b></span><span>Peers <b>${h.peers.length}</b></span></div>`;
    card.style.display = 'block';
    const rows = mine.slice(-7).reverse().map(e => {
      const tm = new Date(e.t * 1000).toTimeString().slice(0, 8);
      return `<div class="row"><span>${tm}</span><span>${esc(e.src_ip || e.src)}</span><span>${esc(e.dst_ip)}</span>
        <span class="bytes">${fmt(e.bytes)}B</span><span class="${e.ok ? 'ok' : 'ng'}">${e.ok ? 'OK' : 'NG'}</span></div>`;
    }).join('') || '<div class="row"><span>-</span><span>このホストの通信はまだありません</span></div>';
    document.getElementById('sessRows').innerHTML = rows;
    sess.style.display = 'block';
  }

  // ── フローの粒(三角形のダーツ) ───────────────────
  const fSrc = document.getElementById('fSrc'), fDst = document.getElementById('fDst');
  function match(q, ip, dev) {
    q = q.trim().toLowerCase();
    if (!q || q === 'any') return true;
    return (ip && ip.startsWith(q)) || (dev && ((hostById[dev] || {}).hostname || dev).toLowerCase().includes(q));
  }
  function spawn(e, delay) {
    if (!match(fSrc.value, e.src_ip, e.src) || !match(fDst.value, e.dst_ip, e.dst)) return;
    const col = e.alerts && e.alerts.length ? '#ffab2e' : e.ok ? '#33d6ff' : '#ff3b4e';
    const n = Math.min(7, 1 + Math.round(Math.log10(1 + e.bytes) / 1.2));
    const segs = [];
    if (hostView) {
      const id = hostView.id, path = e.path || [];
      const i = path.indexOf(id);
      if (e.src === id) segs.push([[0, 0, 0], peerPos[e.dst] || peerPos[e.dst_ip]]);
      else if (e.dst === id) segs.push([peerPos[e.src], [0, 0, 0]]);
      else if (i > 0) { segs.push([peerPos[path[i - 1]], [0, 0, 0]]); if (path[i + 1]) segs.push([[0, 0, 0], peerPos[path[i + 1]]]); }
    } else {
      const a = posForIp(e.src_ip || devIp(e.src)), b = posForIp(e.dst_ip);
      if (a && b && !(inBlock(e.src_ip || '') === false && !inBlock(e.dst_ip))) segs.push([a, b]);
    }
    segs.forEach((sg, k) => {
      if (!sg[0] || !sg[1]) return;
      for (let j = 0; j < n; j++) {
        particles.push({ a: sg[0], b: sg[1], born: performance.now() + delay + k * 900 + j * 110,
          dur: 1500 + Math.random() * 300, col, fail: !e.ok, lift: hostView ? 0.8 : 2 + Math.random() * 1.5 });
      }
    });
    if (particles.length > 1500) particles.splice(0, particles.length - 1500);
  }
  function drawParticles(t) {
    const keep = [];
    for (const p of particles) {
      const u = (t - p.born) / p.dur;
      if (u < 0) { keep.push(p); continue; }

  // ── 背景(標準 / 金魚鉢 / 富士山 / 太陽系)─────────────────────────

  const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  const STARS = Array.from({ length: 160 }, () => ({ x: rnd(), y: rnd() * 0.62, r: 0.4 + rnd() * 1.3, p: rnd() * 6.28 }));

  const FISH = [

  const parallax = () => Math.sin(cam.yaw) * W * 0.06;

  function drawFish(x, y, s, dir, t, col) {
    ctx.save(); ctx.translate(x, y); ctx.scale(dir * s, s);
    const w = Math.sin(t * 0.008) * 0.35;
    // 尾びれ(ひらひら)
    ctx.beginPath(); ctx.moveTo(-26, 0);
    ctx.quadraticCurveTo(-48, -22 + w * 20, -62, -18 + w * 26); ctx.quadraticCurveTo(-50, 0, -62, 18 + w * 26);
    ctx.quadraticCurveTo(-48, 22 + w * 20, -26, 0); ctx.closePath();
    ctx.fillStyle = col[1] + 'cc'; ctx.fill();
    // 体
    const g = ctx.createRadialGradient(6, -6, 2, 0, 0, 30);
    g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
    ctx.beginPath(); ctx.ellipse(0, 0, 30, 17, 0, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    // 背びれ・胸びれ
    ctx.beginPath(); ctx.moveTo(-8, -15); ctx.quadraticCurveTo(2, -30 + w * 6, 12, -15); ctx.fillStyle = col[1] + 'aa'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(6, 10, 9, 4, 0.6 + w, 0, Math.PI * 2); ctx.fillStyle = col[0] + '99'; ctx.fill();
    // 目
    ctx.beginPath(); ctx.arc(18, -4, 3.4, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill();
    ctx.beginPath(); ctx.arc(19, -5, 1.1, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();
  }
  function drawGoldfishBowl(t) {
    const cx = W / 2 + parallax() * 0.5, cy = H * 0.54, R = Math.min(W * 0.49, H * 0.5);
    const wall = ctx.createLinearGradient(0, 0, 0, H);
    wall.addColorStop(0, '#04101c'); wall.addColorStop(0.8, '#02070e'); wall.addColorStop(1, '#0b0805');
    ctx.fillStyle = wall; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(80,55,30,0.35)'; ctx.fillRect(0, cy + R * 0.93, W, H);   // 鉢を置いた台
    ctx.beginPath(); ctx.ellipse(cx, cy + R * 0.97, R * 0.75, R * 0.07, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
    // 水
    const g = ctx.createLinearGradient(0, cy - R, 0, cy + R);
    g.addColorStop(0, '#0f5a78'); g.addColorStop(0.45, '#073449'); g.addColorStop(1, '#021521');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 上から差し込む光
    ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 6; k++) {
      const x0 = cx - R * 0.6 + k * R * 0.24 + Math.sin(t * 0.0004 + k) * 30;
      const lg = ctx.createLinearGradient(0, cy - R, 0, cy + R * 0.3);
      lg.addColorStop(0, 'rgba(150,230,255,0.10)'); lg.addColorStop(1, 'rgba(150,230,255,0)');
      ctx.beginPath(); ctx.moveTo(x0, cy - R); ctx.lineTo(x0 + 40, cy - R); ctx.lineTo(x0 + 140, cy + R * 0.3); ctx.lineTo(x0 + 60, cy + R * 0.3); ctx.closePath();
      ctx.fillStyle = lg; ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    // 水面のゆらぎ(鉢の上の方)
    const sy = cy - R * 0.78;
    ctx.beginPath(); ctx.moveTo(0, sy);
    for (let x = 0; x <= W; x += 16) ctx.lineTo(x, sy + Math.sin(x * 0.02 + t * 0.002) * 4);
    ctx.lineTo(W, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fillStyle = 'rgba(2,10,18,0.85)'; ctx.fill();
    ctx.strokeStyle = 'rgba(160,230,255,0.35)'; ctx.lineWidth = 1.5; ctx.beginPath();
    for (let x = 0; x <= W; x += 16) { const y = sy + Math.sin(x * 0.02 + t * 0.002) * 4; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
    // 底の砂利と水草
    for (let k = 0; k < 220; k++) {
      const a = (k * 97.13) % 1, px = cx - R + a * R * 2, py = cy + R * (0.80 + ((k * 31.7) % 1) * 0.2);
      ctx.fillStyle = ['#c9a36b', '#8e6f4a', '#e6d2a8', '#6d5a48'][k % 4]; ctx.beginPath(); ctx.arc(px, py, 3 + (k % 3), 0, Math.PI * 2); ctx.fill();
    }
    for (let k = 0; k < 7; k++) {
      const bx = cx - R * 0.7 + k * R * 0.23, hgt = R * (0.35 + (k % 3) * 0.12);
      ctx.strokeStyle = k % 2 ? 'rgba(60,170,90,0.75)' : 'rgba(40,130,70,0.75)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(bx, cy + R * 0.86);
      for (let s = 1; s <= 10; s++) { const yy = cy + R * 0.86 - hgt * s / 10; ctx.lineTo(bx + Math.sin(s * 0.7 + t * 0.0012 + k) * 14 * s / 10, yy); }
      ctx.stroke();

  // ダークネット観測の無いサーバー(スタンドアロン版)では DARKNET ボタンも出さない
  fetch('/api/darknet', { headers: token ? { 'X-Session-Token': token } : {} })
    .then(r => { if (r.status === 404) document.getElementById('mDark').style.display = 'none'; })
    .catch(() => { /* 一時的な不達では隠さない */ });

  update();
  requestAnimationFrame(frame);
})();
</script>
<div id="nb"></div>
<script src="nirvana-board.js"></script>
</body>
