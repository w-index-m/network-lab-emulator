# Cyber View(スタンドアロン版)の設定例
#
# 装置とつながり(トポロジ)は手書き。データの取り込み口は使うものだけ残す。
# ${ENV_NAME} と書くと起動時の環境変数で置き換える(トークン等はファイルに直接書かない)。
#
# この例は network-lab-emulator のラボ(CR1─CR2─CR3)に合わせてある。実機では
# 装置名・管理IP・インタフェース名・つながりを自分の環境に書き換える。

title: 本番ネットワーク
poll_interval: 10                # 秒。ログ取り込み・アラート判定の周期
link_speed_bps: 1000000000       # 既定のリンク速度(使用率の分母)。links ごとに speed で上書き可

# auth:
#   token: ${CYBER_VIEW_TOKEN}   # 設定すると画面を http://host:8090/?token=... で開く必要がある

devices:
  # id         : この画面の中での名前(英数字)
  # hostname   : 表示名。syslog の本文や Zabbix のホスト名との照合にも使う
  # type       : cisco / catalyst / nexus / sir / srs 等(フラップ検知のログ形式の判定に使う)
  # mgmt_ip    : 管理IP(= Prometheus の instance / syslog の送信元)。省略時は最初のIF
  # zabbix_host: Zabbix 上のホスト名(省略時は hostname)
  # interfaces : IPアドレス空間の画面に置くためのIF(name は ifName/ifDescr と同じ表記で。短縮形でも可)
  - id: cr1
    hostname: CR1
    type: cisco
    mgmt_ip: 10.240.12.1
    interfaces:
      - {name: GigabitEthernet0/0/0, ip: 10.240.12.1, prefix: 30, desc: WAN to CR2}
      - {name: GigabitEthernet0/0/1, ip: 10.240.1.1, prefix: 24, desc: LAN tokyo}
  - id: cr2
    hostname: CR2
    type: cisco
    mgmt_ip: 10.240.12.2
    interfaces:
      - {name: GigabitEthernet0/0/0, ip: 10.240.12.2, prefix: 30}
      - {name: GigabitEthernet0/0/1, ip: 10.240.2.1, prefix: 24}
      - {name: GigabitEthernet0/0/2, ip: 10.240.23.1, prefix: 30}
  - id: cr3
    hostname: CR3
    type: cisco
    mgmt_ip: 10.240.23.2
    interfaces:
      - {name: GigabitEthernet0/0/0, ip: 10.240.23.2, prefix: 30}
      - {name: GigabitEthernet0/0/1, ip: 10.240.3.1, prefix: 24}

links:
  - {a: cr1, a_if: GigabitEthernet0/0/0, b: cr2, b_if: GigabitEthernet0/0/0}
  - {a: cr2, a_if: GigabitEthernet0/0/2, b: cr3, b_if: GigabitEthernet0/0/0, speed: 100000000}

sources:
  # Prometheus + snmp_exporter(if_mib): 流量 rate(ifHCIn/OutOctets)・ifOperStatus・up
  prometheus:
    url: http://127.0.0.1:9090
    job: cisco-snmp              # snmp_exporter を叩いている scrape job 名

  # Loki: syslog。ログのラベル(device_labels の順に探す)か本文の装置名で装置を特定する
  loki:
    url: http://127.0.0.1:3100
    query: '{job=~".+"}'
    device_labels: [device_id, host, hostname, instance]

  # Zabbix: API トークン(または user/password)。「Network interfaces by SNMP」系テンプレートの
  # Interface ...: Bits received / Bits sent / Operational status と、未解決の問題を読む
  # zabbix:
  #   url: http://zabbix.example.local/api_jsonrpc.php
  #   token: ${ZABBIX_TOKEN}

  # MRTG(cfgmaker が作った mrtg.cfg を読み、Target の装置・IF とこの設定の devices を自動で対応づける)。
  # LogFormat が rrdtool なら .rrd を rrdtool fetch で読む(rrdtool コマンドが要る)
  # 場所の候補: /etc/mrtg.cfg(Debian 系)、/etc/mrtg/mrtg.cfg(RHEL 系)、/usr/local/etc/mrtg/mrtg.cfg(FreeBSD)、
  #             /usr/local/mrtg-2/conf/mrtg.cfg(ソースから入れた場合)。見つからないときは /api/health の errors に出る
  # mrtg:
  #   cfg: /etc/mrtg.cfg
  #   stale: 900                     # これより古い値(秒)は出さない(MRTG が止まっていても 0 と見せない)

  # Cacti(Interface - Traffic のデータソースの RRD。traffic_in / traffic_out)。どのファイルがどの IF かは
  # Cacti の DB にしか無いので、ここに書く(install.sh は見つけたファイルをコメントで下書きに出す)
  # rra_dir の候補: /var/lib/cacti/rra、/usr/share/cacti/rra、/var/www/html/cacti/rra、/usr/share/cacti/site/rra
  # cacti:
  #   rra_dir: /var/lib/cacti/rra
  #   targets:
  #     - {device: cr1, if: GigabitEthernet0/0/0, file: cr1_traffic_in_12.rrd}

  # SNMP で装置に直接問い合わせ、経路表(IP-FORWARD-MIB)と CPU(CISCO-PROCESS-MIB)を定期取得する。
  # 経路の追加・削除・変更と CPU の急上昇・回復が「情」、CPU が高い状態が続くと「注」(警告)になる
  # snmp:
  #   community: netlab-ro           # 装置ごとに変えるなら devices[].snmp_community
  #   v3:                            # SNMPv3 で取るなら(書いた場合は community を使わない。装置ごとは devices[].snmp_v3)
  #     user: nms
  #     auth: sha                    # md5 / sha / sha224 / sha256 / sha384 / sha512
  #     auth_password: ${SNMP_AUTH_PASS}
  #     priv: aes                    # des / aes(=128) / aes192 / aes256(Blumenthal)/ aes192c / aes256c(Cisco の Reeder 方式)
  #     priv_password: ${SNMP_PRIV_PASS}
  #   interval: 60                   # 秒
  #   full_every: 5                  # 経路数が変わらなくても N 回に1回は経路表全体を取り直す
  #   cpu: {high: 80, jump: 20, hold: 2}   # high% 以上が hold 回続くと注、前回から jump 以上上がると情
  #   # CPU の OID(機種固有の MIB を使う時。装置ごとなら devices[].snmp_cpu_oid)。無ければ Cisco → hrProcessorLoad
  #   # cpu: {oid: 1.3.6.1.4.1.1182....}

  # NetFlow v5 / sFlow v5 を受ける(ダークネット観測・通信の粒・外部への大量送信の検知に使う)
  # flow: {netflow: 2055, sflow: 6343, bind: 0.0.0.0}
  # ダークネット(使っていない帯)。届いたフローをスキャン・DDoS の跳ね返り等に分類する
  # darknet: {prefixes: [10.250.0.0/24]}
  # 回線チェック: 本物の ping(ICMP)で遅延とロスを測る。"host:port" なら TCP の接続時間
  # wan_probe:
  #   - {name: プロバイダ出口, target: 203.0.113.1}
  #   - {name: 本社 VPN, target: 10.0.0.1:443}
  # wan_probe_interval: 10
  # 複数拠点の横断分析(ネクサス)。url を書くと中央へ送る。url 無しで token だけなら、この画面が中央になる
  # nexus: {url: http://central.example.local:8090, site: 名古屋, token: ${NEXUS_TOKEN}}

  # SNMP trap(linkDown / linkUp)をこの画面で直接受ける場合
  # snmp_trap:
  #   listen: 0.0.0.0:1162

# 地球儀(WORLD): 拠点の位置と、外の情報源(クラウドの IP 範囲・Cloudflare Radar・IIJ IHR・RIPE Atlas・
# DShield・DB-IP の都市 DB)。届かない元は「取れない」と表示する。CLOUDFLARE_API_TOKEN 等は環境変数で
# site: {name: 東京, lat: 35.68, lon: 139.76, country: JP, asn: 2497}
# world:
#   enabled: true
#   cache_dir: data/world
#   pairs: [[JP, US], [US, RU]]        # Atlas で見る国の組

# AI ログ解析(画面の AI ボタン)。鍵は環境変数で渡す(ここには書かない):
#   ANTHROPIC_API_KEY(Claude)/ GROQ_API_KEY・OPENAI_API_KEY・NIRVANA_AI_BASE_URL+NIRVANA_AI_KEY / OLLAMA_URL
#   NIRVANA_AI_PROVIDER=claude|openai|ollama|rules、NIRVANA_AI_MODEL、NIRVANA_AI_REDACT_IPS=0(IP を伏せない)
# 単体版は装置にログインしないので、提案されたコマンドは表示とコピーだけ(実行はしない)
